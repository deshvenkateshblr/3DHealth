<script>
const state = loadState();
renderHeader('diagnostics', 'KYH-Diagnostics');
renderFooter();

const profile = state.profile;
const main = document.getElementById('main-content');


const RECENCY_OPTIONS = ['Within 6 months','6\u201312 months ago','1\u20132 years ago','2+ years ago'];
const RESULT_OPTIONS = ['Within range','Flagged \u2014 needs attention','Not sure'];

/* ---- symptom -> tests index, derived from DIAG itself
   (single source of truth: each test record owns its own `symptoms` array) ---- */
const SYMPTOM_TO_TESTS = {};
DIAG.forEach(d=>{
  (d.symptoms||[]).forEach(s=>{
    (SYMPTOM_TO_TESTS[s] = SYMPTOM_TO_TESTS[s] || []).push(d.test);
  });
});

/* ---- priority risk-group tests ----
   Some low-risk baseline tests deserve to jump ahead of the generic
   baseline panel for specific, well-established demographic/lifestyle
   risk groups -- even before any symptom is reported. Kept as explicit,
   named rules rather than a scoring formula so it's easy to see exactly
   which cohort earns which test, and easy to extend later. Order in the
   returned list is the order they get pinned in. */
function getPriorityRiskTests(profile){
  const out = [];
  const age = profile.age || 0;
  const syms = profile.symptoms || [];
  // Core cardiometabolic checks (NEEDS PHYSICIAN REVIEW): standard first-line
  // work-up for a known cardiovascular/metabolic condition, or from age 40.
  const knownCardio = ['High Blood Pressure', 'Hypertension', 'High Cholesterol'].some(x => syms.includes(x));
  const knownMetabolic = ['Diabetes', 'Type 2 Diabetes', 'Pre-diabetes', 'Prediabetes'].some(x => syms.includes(x));
  if (knownCardio || knownMetabolic || age >= 40) {
    out.push({test: 'Lipid Profile', reason: knownCardio || knownMetabolic ? 'Known condition' : 'Age 40+'});
    out.push({test: 'HbA1c', reason: knownMetabolic ? 'Known condition' : knownCardio ? 'Blood-pressure work-up' : 'Age 40+'});
  }
  if (knownCardio) {
    out.push({test: 'ECG', reason: 'Blood-pressure work-up'});
  }
  const menopausal = profile.reproStatus === 'Perimenopausal' || profile.reproStatus === 'Post-menopausal';
  const highDeficiencyRiskDiet = ['Vegan', 'Vegetarian', 'Jain'].includes(profile.dietType);

  // Bone health: estrogen decline (peri/post-menopausal) or general age 50+
  // both meaningfully accelerate bone loss -- Vitamin D and Calcium matter
  // more here than as a generic baseline line item.
  if (menopausal) {
    out.push({test: 'Vitamin D', reason: profile.reproStatus});
    out.push({test: 'Calcium Test', reason: profile.reproStatus});
  } else if (age >= 50) {
    out.push({test: 'Vitamin D', reason: 'Age 50+'});
    out.push({test: 'Calcium Test', reason: 'Age 50+'});
  }

  // B12: absorption declines with age (reduced stomach acid) independent
  // of diet, OR low dietary intake on a vegan/vegetarian/Jain diet.
  if (age >= 60) {
    out.push({test: 'Vitamin B12', reason: 'Age 60+'});
  } else if (highDeficiencyRiskDiet) {
    out.push({test: 'Vitamin B12', reason: `${profile.dietType} diet`});
  }

  // Iron: primarily a dietary-intake risk group.
  if (highDeficiencyRiskDiet) {
    out.push({test: 'Iron Studies', reason: `${profile.dietType} diet`});
  }

  // Age- and sex-based cancer screening (not metabolic risk).
  // Pinned so they are not crowded out of the top 10 by generic labs.
  if (profile.sex === 'Female' && age >= 21) {
    out.push({test: 'Pap Smear', reason: 'Cervical screening from age 21'});
  }
  if (profile.sex === 'Female' && age >= 40) {
    out.push({test: 'Mammography', reason: 'Breast screening from age 40'});
  }
  if (profile.sex === 'Male' && age >= 50) {
    out.push({test: 'PSA', reason: 'Prostate screening discussion from age 50'});
  }
  if (age >= 45) {
    out.push({test: 'FIT Test', reason: 'Colorectal screening from age 45'});
  }

  return out;
}

/* ---- baseline (category-driven) selection, used to fill any slots symptoms/priority don't cover ---- */
/* Specialist endocrine tests: not useful as a no-symptom baseline fill. (NEEDS PHYSICIAN REVIEW) */
const BASELINE_LAST = ['Cortisol', 'DHEA-S'];
/* Baseline fill (no symptom or risk reason) may only use general health-check tests.
   Condition-specific work-ups (hormone panels, sleep study, lung function, specialist
   imaging, STI screens that depend on personal history) never appear without a reason.
   Age/sex limits still come from each test's own record. (NEEDS PHYSICIAN REVIEW) */
const BASELINE_SCREENING = new Set([
  'Basic Metabolic Panel','CBC','Urinalysis','Vitamin D','Vitamin B12','Thyroid Function Test',
  'Lipid Profile','Fasting Glucose','HbA1c','Liver Function Tests','Kidney Function Tests',
  'Blood Pressure Monitoring','ECG','Pap Smear','HPV Test','Mammography','Bone Density (DEXA)',
  'PSA','Colonoscopy','FIT Test','Eye Exam','Hearing Test','Cognitive Screening',
  'Skin Cancer Screening','Dental Exam','Hepatitis B Surface Antigen','Hepatitis C Antibody'
]);
function selectBaseline(matches, cats, limit, exclude){
  const groups = {};
  matches.forEach(d=>{
    if(exclude.has(d.test) || !BASELINE_SCREENING.has(d.test)) return;
    const tokens = d.profile.split(';').map(s=>s.trim());
    const g = GROUP_ORDER.find(o=>tokens.includes(o) && cats.includes(o)) || 'Low Risk';
    (groups[g]=groups[g]||[]).push(d);
  });

  Object.keys(groups).forEach(g =>
    groups[g].sort((a, b) =>
      (BASELINE_LAST.includes(a.test) - BASELINE_LAST.includes(b.test)) ||
      (a.clinical_tier || 3) - (b.clinical_tier || 3) ||
      a.test.localeCompare(b.test)
    )
  );

  const present = GROUP_ORDER.filter(g=>groups[g] && groups[g].length);
  const out = [];
  let idx = 0;
  while(out.length<limit && present.some(g=>groups[g].length)){
    const g = present[idx % present.length];
    if(groups[g].length){
      const d = groups[g].shift();
      out.push(Object.assign({group:g, viaSymptoms:[], bySymptom:false}, d));
    }
    idx++;
  }
  return out;
}

/* ---- symptom-driven selection, ranked highest priority ---- */
function selectFromSymptoms(matches, cats, selectedSymptomsArr){
  const byName = {};
  matches.forEach(d=>{ byName[d.test] = d; });
  const out = [];
  const seen = new Set();
  selectedSymptomsArr.forEach(sym=>{
    (SYMPTOM_TO_TESTS[sym]||[]).forEach(testName=>{
      const d = byName[testName];
      if(!d) return; // not appropriate for this gender/age/profile — skip
      if(seen.has(testName)){
        const existing = out.find(t=>t.test===testName);
        if(existing && !existing.viaSymptoms.includes(sym)) existing.viaSymptoms.push(sym);
        return;
      }
      seen.add(testName);
      const tokens = d.profile.split(';').map(s=>s.trim());
      const g = GROUP_ORDER.find(o=>tokens.includes(o) && cats.includes(o)) || tokens[0] || 'Low Risk';
      out.push(Object.assign({group:g, viaSymptoms:[sym], bySymptom:true}, d));
    });
  });
  return out;
}

/* Overlap families: tests that largely measure the same thing. Only the
   best-ranked member of a family is shown, so the top 10 isn't spent three
   times on the same organ. (NEEDS PHYSICIAN REVIEW) */
const OVERLAP_FAMILIES = [
  ['Kidney Function Tests', 'Creatinine', 'Basic Metabolic Panel', 'Electrolyte Panel']
];
/* Screening / specialist tests that should not outrank first-line tests when
   the ONLY link is a non-specific symptom such as fatigue. (NEEDS PHYSICIAN REVIEW) */
const NONSPECIFIC_SYMPTOMS = ['Fatigue', 'Low Energy'];
const SECOND_LINE_FOR_VAGUE = ['Hepatitis B Surface Antigen', 'Hepatitis C Antibody', 'Tuberculosis Test',
  'Bone Marrow Biopsy', 'C-Peptide', 'Insulin', 'OGTT', 'BNP', 'Echocardiogram', 'Iodine'];
const MAX_RESERVED = 4;   // slots held for risk-group / condition tests
const MIN_SYMPTOM_SLOTS = 6;

function dedupeFamilies(list){
  const seenFam = new Set();
  return list.filter(t => {
    const fi = OVERLAP_FAMILIES.findIndex(f => f.includes(t.test));
    if (fi < 0) return true;
    if (seenFam.has(fi)) return false;
    seenFam.add(fi);
    return true;
  });
}
function vagueOnly(t){
  return SECOND_LINE_FOR_VAGUE.includes(t.test) &&
    (t.viaSymptoms || []).length > 0 &&
    t.viaSymptoms.every(s => NONSPECIFIC_SYMPTOMS.includes(s));
}
function rankCmp(a, b){
  return (vagueOnly(a) - vagueOnly(b)) ||
    (a.clinical_tier || 3) - (b.clinical_tier || 3) ||
    b.viaSymptoms.length - a.viaSymptoms.length ||
    a.test.localeCompare(b.test);
}

function buildRecommendations(matches, cats, selectedSymptomsArr, profile){
  const byName = {};
  matches.forEach(d => { byName[d.test] = d; });

  // 1. Risk-group / known-condition tests (reserved slots, capped).
  const reserved = [];
  const usedNames = new Set();
  getPriorityRiskTests(profile).forEach(({test, reason}) => {
    if (reserved.length >= MAX_RESERVED || usedNames.has(test)) return;
    const d = byName[test];
    if (!d) return; // not eligible for this profile's age/gender/category
    usedNames.add(test);
    const tokens = d.profile.split(';').map(s => s.trim());
    const g = GROUP_ORDER.find(o => tokens.includes(o) && cats.includes(o)) || 'Low Risk';
    reserved.push(Object.assign({group: g, viaSymptoms: [], bySymptom: false, viaRiskGroup: true, riskGroupReason: reason}, d));
  });

  // 2. Symptom-matched tests: first-line first, then by how many of the
  //    person's symptoms they explain; overlapping tests collapsed.
  const priorityByTest = {};
  getPriorityRiskTests(profile).forEach(({test, reason}) => {
    if (!(test in priorityByTest)) priorityByTest[test] = reason;
  });
  const symptomAll = selectFromSymptoms(matches, cats, selectedSymptomsArr)
    .filter(t => !usedNames.has(t.test));
  // A reserved test that is also symptom-matched keeps its symptom links.
  selectFromSymptoms(matches, cats, selectedSymptomsArr).forEach(t => {
    const r = reserved.find(x => x.test === t.test);
    if (r) { r.viaSymptoms = t.viaSymptoms; r.bySymptom = true; }
  });
  const room = 10 - reserved.length;
  const symptomTests = dedupeFamilies(symptomAll.sort(rankCmp).filter(t => {
    // drop family members already covered by a reserved test
    const f = OVERLAP_FAMILIES.find(f => f.includes(t.test));
    return !(f && reserved.some(r => f.includes(r.test)));
  })).slice(0, Math.max(room, MIN_SYMPTOM_SLOTS));
  symptomTests.forEach(t => {
    if (priorityByTest[t.test]) { t.viaRiskGroup = true; t.riskGroupReason = priorityByTest[t.test]; }
  });

  // 3. Merge, order by tier then symptom relevance, cap at 10.
  let combined = reserved.concat(symptomTests);
  combined.sort((a, b) => (a.clinical_tier || 3) - (b.clinical_tier || 3) ||
    b.viaSymptoms.length - a.viaSymptoms.length || a.test.localeCompare(b.test));
  combined = combined.slice(0, 10);
  combined.forEach(t => usedNames.add(t.test));
  symptomTests.forEach(t => usedNames.add(t.test));

  // 4. Baseline fill for whatever's left.
  if (combined.length < 10) {
    selectBaseline(matches, cats, 10 - combined.length, usedNames).forEach(t => combined.push(t));
  }
  return combined;
}


/* ---- Exclusion Filter ---- */
function isExcluded(d, userTraits) {
  if (!d.exclusions || !d.exclusions.length) return false;
  return d.exclusions.some(ext => userTraits.includes(ext));
}

function renderResultsStage(){
  const symptoms = profile.symptoms || [];
  const {cats} = activeCategories(profile);

  // Build the user's traits array for the exclusion check
  const userExclusionTraits = [
    profile.reproStatus,
    profile.alcohol ? `Alcohol: ${profile.alcohol}` : null,
    profile.smoking ? `Smoking: ${profile.smoking}` : null
  ].filter(Boolean);

  // Filter DIAG using gender, age, profile, and our new exclusion check
  const matches = DIAG.filter(d =>
    genderMatch(d.gender, profile.sex) &&
    ageRelevancyMatch(d.age, profile.age) &&
    profileMatch(d.profile, cats) &&
    !isExcluded(d, userExclusionTraits)
  );

  const top10 = buildRecommendations(matches, cats, symptoms, profile);
  const prevAnswers = (state.diagnostics && state.diagnostics.answers) || {};

  let cardsHtml = '';
  top10.forEach((d, i)=>{
    const watchFor = (d.symptoms && d.symptoms.length) ? d.symptoms.slice(0,4).join(', ') : NO_SYMPTOM_FALLBACK[d.group];
    const prev = prevAnswers[d.test] || {};
    const doneYes = prev.done === true;
    const doneNo = prev.done === false;
    const recencyOpts = RECENCY_OPTIONS.map(r=>`<option value="${r}" ${prev.recency===r?'selected':''}>${r}</option>`).join('');
    const resultOpts = RESULT_OPTIONS.map(r=>`<option value="${r}" ${prev.resultStatus===r?'selected':''}>${r}</option>`).join('');
    const matchReasons = [].concat(
      d.bySymptom ? d.viaSymptoms : [],
      d.viaRiskGroup ? [d.riskGroupReason] : []
    );
    const originTag = matchReasons.length
      ? `<span class="tag ok">Matches: ${esc(matchReasons.join(', '))}</span>`
      : `<span class="tag">${esc(d.group)}</span>`;

    // ADDED: UI chips for Sample Type and Prep
    const sampleChip = d.sample_type ? `<span class="tag" style="background:var(--paper);border:none;">${esc(d.sample_type)}</span>` : '';
    const prepChip = d.prep && d.prep !== "None" ? `<span class="tag" style="background:var(--paper);border:none;">Prep: ${esc(d.prep)}</span>` : '';

    // ADDED: The Info Tooltip icon and content
    const tooltipId = `tooltip-content-${i}`;
    const infoIcon = d.extended_info ? `
      <div class="info-tooltip-wrap" tabindex="0" role="tooltip" aria-label="More info about ${esc(d.test)}" aria-describedby="${tooltipId}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <div class="info-tooltip-content" id="${tooltipId}">${esc(d.extended_info)}</div>
      </div>
    ` : '';

    cardsHtml += `
    <div class="test-card" data-test="${esc(d.test)}">
      <div class="head">
        <div>
          <div class="name" style="display:flex; align-items:center;">
            ${i+1}. ${esc(d.test)}
            ${infoIcon}
          </div>
          <div class="test-desc">${esc(d.note)}.</div>
          <div style="display:flex; gap:6px; margin-top:6px;">
            ${sampleChip} ${prepChip}
          </div>
          <div class="symptom" style="margin-top:8px;"><b>Watch for:</b> ${esc(watchFor)}</div>
        </div>
        ${originTag}
      </div>
      <div class="answers">
        <span class="intake-label" style="margin:0;">Already done?</span>
        <div class="radio-pair">
          <input type="radio" name="done-${i}" id="done-${i}-yes" value="yes" ${doneYes?'checked':''}>
          <label for="done-${i}-yes">Yes</label>
          <input type="radio" name="done-${i}" id="done-${i}-no" value="no" ${doneNo?'checked':''}>
          <label for="done-${i}-no">No</label>
        </div>
        <select class="recency-select" id="recency-${i}" aria-label="When did you last have ${esc(d.test)}?" ${doneYes?'':'disabled'}>
          <option value="">How long ago?</option>
          ${recencyOpts}
        </select>
      </div>
      <div class="result-row" id="result-row-${i}" style="${doneYes?'':'display:none;'}">
        <select class="recency-select" id="result-status-${i}" aria-label="Result status for ${esc(d.test)} (optional)">
          <option value="">Result status (optional, self-reported)</option>
          ${resultOpts}
        </select>
        <input type="text" class="result-note-input" id="result-note-${i}" aria-label="Notes on your ${esc(d.test)} result" placeholder="Notes, e.g. &quot;Vitamin D 18 ng/mL&quot;" value="${esc(prev.resultNote||'')}">
      </div>
    </div>`;
  });

  const symptomDrivenCount = top10.filter(d=>d.bySymptom).length;

  // Only take credit for symptoms that actually landed a test in this list —
  // a symptom can fail to match if every test for it is gated by age/risk
  // category the user doesn't fall into. Say so honestly instead of implying
  // every listed symptom shaped the results below.
  const matchedSymptomSet = new Set();
  top10.forEach(d => (d.viaSymptoms || []).forEach(s => matchedSymptomSet.add(s)));
  const matchedSymptomsList = symptoms.filter(s => matchedSymptomSet.has(s));
  const unmatchedSymptomsList = symptoms.filter(s => !matchedSymptomSet.has(s));

  let symptomLine;
  if (!symptoms.length) {
    symptomLine = `No symptoms on file &mdash; this is your risk-profile baseline. <a href="symptoms.html">Add symptoms &rarr;</a>`;
  } else {
    const basedOnText = matchedSymptomsList.length
      ? `Based on: ${matchedSymptomsList.map(esc).join(', ')}`
      : `Based on your risk profile`;
    const unmatchedNote = unmatchedSymptomsList.length
      ? ` &middot; ${unmatchedSymptomsList.map(esc).join(', ')} ${unmatchedSymptomsList.length > 1 ? "don't have a dedicated test for your profile" : "doesn't have a dedicated test for your profile"} &mdash; it's covered by the general screening below`
      : '';
    symptomLine = `${basedOnText}${unmatchedNote} &middot; <a href="symptoms.html">adjust on your symptoms &rarr;</a>`;
  }

  main.innerHTML = `
  <div class="section-head">
    <h2>${top10.length < 10 ? "Your matched tests" : "Your top 10 tests"}</h2>
  </div>
  <p class="lede">${symptomLine}</p>
  <p class="section-sub" style="display:block;margin-bottom:14px;">${matches.length} tests matched your profile &middot; ${symptomDrivenCount} pulled in directly from your symptoms, the rest fill out your baseline risk panel</p>
  <div id="soft-gate-banner" style="display:none; border:2px solid var(--amber); background:var(--amber-soft); padding:16px 18px; margin-bottom:28px; color:#5a3d1c;" role="status">
    <div style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;">A few tests unanswered</div>
    <div style="font-size:14px;line-height:1.6;">
      Knowing which tests you&rsquo;ve already had lets us highlight exactly what&rsquo;s still missing &mdash;
      your summary and action plan sharpen with every answer.
    </div>
    <div style="margin-top:10px;">
      <a href="#" id="soft-gate-continue-link" style="font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);text-decoration:underline;">
        That&rsquo;s fine &mdash; continue anyway &rarr;
      </a>
    </div>
  </div>
  <div id="cards">${cardsHtml}</div>
  <div class="page-footer-nav">
    <a href="symptoms.html" class="btn secondary">&larr; Back</a>
    <span id="answer-counter" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 14px;white-space:nowrap;"></span>
    <button class="btn" id="continue-btn">Continue to Routine &rarr;</button>
  </div>`;

  document.querySelectorAll('.test-card').forEach((card, i)=>{
    const yes = card.querySelector(`#done-${i}-yes`);
    const no = card.querySelector(`#done-${i}-no`);
    const sel = card.querySelector(`#recency-${i}`);
    const resultRow = card.querySelector(`#result-row-${i}`);
    yes.addEventListener('change', ()=>{ sel.disabled=false; resultRow.style.display=''; });
    no.addEventListener('change', ()=>{
      sel.disabled=true; sel.value='';
      resultRow.style.display='none';
      card.querySelector(`#result-status-${i}`).value='';
      card.querySelector(`#result-note-${i}`).value='';
    });
  });


  // Soft gate: live answer counter + two-click confirm
  let confirmPending = false;
  function countAnswered() {
    return [...document.querySelectorAll('.test-card')]
      .filter(card => card.querySelector('input[type=radio]:checked')).length;
  }
  function updateCounter() {
    const n = countAnswered(), total = document.querySelectorAll('.test-card').length;
    const el = document.getElementById('answer-counter');
    const btn = document.getElementById('continue-btn');
    if (!el) return;
    el.textContent = n === total ? '' : `${n} of ${total} answered`;
    el.style.color = 'var(--muted)';
    el.style.fontWeight = '';
    el.style.fontSize = '12px';
    confirmPending = false;
    btn.textContent = 'Continue to Routine \u2192';
    document.querySelectorAll('.test-card.card-needs-answer').forEach(c => c.classList.remove('card-needs-answer'));
    const banner = document.getElementById('soft-gate-banner');
    if (banner) banner.style.display = 'none';
  }
  document.getElementById('cards').addEventListener('change', e => {
    if (e.target.type === 'radio') updateCounter();
  });
  updateCounter();

  function proceedToNext() {
    const answers = {};
    document.querySelectorAll('.test-card').forEach((card, i) => {
      const testName = card.dataset.test;
      const yesChecked = card.querySelector(`#done-${i}-yes`).checked;
      const noChecked  = card.querySelector(`#done-${i}-no`).checked;
      const recency       = card.querySelector(`#recency-${i}`).value;
      const resultStatus  = card.querySelector(`#result-status-${i}`).value;
      const resultNote    = card.querySelector(`#result-note-${i}`).value.trim();
      if (yesChecked || noChecked) {
        answers[testName] = {
          done: yesChecked,
          recency:      yesChecked ? (recency      || null) : null,
          resultStatus: yesChecked ? (resultStatus || null) : null,
          resultNote:   yesChecked ? (resultNote   || null) : null
        };
      }
    });
    const diagnostics = {
      topTests: top10.map(d => ({test:d.test, group:d.group, bySymptom:d.bySymptom, viaSymptoms:d.viaSymptoms, viaRiskGroup:d.viaRiskGroup||false, riskGroupReason:d.riskGroupReason||null})),
      answers
    };
    goTo('routine.html', Object.assign({}, state, {diagnostics}));
  }

  document.getElementById('soft-gate-continue-link').addEventListener('click', e => {
    e.preventDefault();
    proceedToNext();
  });

  document.getElementById('continue-btn').addEventListener('click', () => {
    const n = countAnswered(), total = document.querySelectorAll('.test-card').length;
    if (n < total && !confirmPending) {
      confirmPending = true;
      // Show banner at top and scroll to it
      const banner = document.getElementById('soft-gate-banner');
      banner.style.display = '';
      banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
      // Update footer counter to a simple amber count (no long message — banner handles it)
      const el = document.getElementById('answer-counter');
      el.textContent = `${n} of ${total} answered`;
      el.style.color = 'var(--amber)';
      el.style.fontWeight = '600';
      el.style.fontSize = '12px';
      document.getElementById('continue-btn').textContent = 'Continue anyway \u2192';
      // Flash all unanswered cards
      const unanswered = [...document.querySelectorAll('.test-card')]
        .filter(card => !card.querySelector('input[type=radio]:checked'));
      unanswered.forEach(card => {
        card.classList.remove('card-needs-answer');
        void card.offsetWidth;
        card.classList.add('card-needs-answer');
      });
      return;
    }
    proceedToNext();
  });
}

if(!profile){
  main.innerHTML = `<div class="empty-state">We need your profile first. <a href="profile.html">Go back and fill it in &rarr;</a></div>`;
} else {
  renderResultsStage();
}
</script>
</body>
</html>
