<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Prepare for your doctor's visit with a clinical summary, explore curated educational videos, and generate custom AI prompts tailored to your health.">
          <title>Next Steps — KYH</title>
          <link rel="stylesheet" href="shared/styles.css?v=20261016-06a3e55">
            <style>
              .prompt-box {
              background: var(--panel);
              border: 1px solid var(--line);
              padding: 16px 18px;
              font-family: var(--mono);
              font-size: 12.5px;
              line-height: 1.55;
              white-space: pre-wrap;
              max-height: 320px;
              overflow-y: auto;
              margin-bottom: 12px;
              }
              .section-subnav {
              position: sticky;
              top: 0;
              z-index: 20;
              display: flex;
              align-items: center;
              gap: 16px;
              background: var(--paper);
              border-bottom: 1px solid var(--line);
              padding: 12px clamp(16px, 4vw, 48px);
              font-family: var(--mono);
              font-size: 11.5px;
              letter-spacing: .05em;
              text-transform: uppercase;
              }
              .subnav-back { color: var(--ink-soft); text-decoration: none; font-weight: 600; }
              .subnav-back:hover { color: var(--teal); }
              .subnav-sep { color: var(--line); }
              .subnav-link { color: var(--ink-soft); text-decoration: none; }
              .subnav-link:hover { color: var(--teal); }
              @media print { .section-subnav { display: none !important; } }
              .video-grid {
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
              gap: 14px;
              margin-bottom: 16px;
              }
              .video-card {
              display: block;
              text-decoration: none;
              color: inherit;
              border: 1px solid var(--line);
              background: var(--panel);
              transition: border-color .15s;
              }
              .video-card:hover { border-color: var(--teal); }
              .video-thumb-wrap {
              position: relative;
              aspect-ratio: 16/9;
              background: var(--line);
              overflow: hidden;
              }
              .video-thumb-wrap img {
              width: 100%; height: 100%; object-fit: cover; display: block;
              }
              .video-duration {
              position: absolute; bottom: 6px; right: 6px;
              background: rgba(0,0,0,.75); color: #fff;
              font-family: var(--mono); font-size: 10px; padding: 2px 5px;
              }
              .video-title {
              font-size: 13px; font-weight: 600; padding: 10px 12px 4px;
              line-height: 1.35;
              }
              .video-tags { padding: 0 12px 12px; display: flex; flex-wrap: wrap; gap: 4px; }
              .video-source-title {
              font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
              text-transform: uppercase; color: var(--muted); margin: 20px 0 10px;
              }
              #doctor, #ai, #learn { scroll-margin-top: 20px; }
            </style>
          <!-- share:start -->
<link rel="icon" href="shared/assets/kyh_logo_final.png?v=20261016-06a3e55">
<meta name="theme-color" content="#1f7a6d">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KYH — Know Your Health">
<meta property="og:title" content="Next Steps — KYH">
<meta property="og:description" content="Prepare for your doctor&#x27;s visit with a clinical summary, explore curated educational videos, and generate custom AI prompts tailored to your health.">
<meta property="og:url" content="https://vividnova.com/3DHealth/nextsteps.html">
<meta property="og:image" content="https://vividnova.com/3DHealth/shared/assets/og-image.png?v=20261016-06a3e55">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- share:end -->
</head>
  <body>

    <header class="masthead" id="app-header"></header>

    <nav class="section-subnav no-print" id="section-subnav">
      <a href="summary.html" class="subnav-back">&larr; Summary</a>
      <span class="subnav-sep">&middot;</span>
      <a href="#doctor" class="subnav-link">Doctor Brief</a>
      <a href="#ai" class="subnav-link">AI Prompt</a>
      <a href="#learn" class="subnav-link">Videos</a>
    </nav>

    <main id="main-content">
      <div class="empty-state">Loading next steps…</div>
    </main>

    <footer>
      <span>KYH — Know Your Health. Own Your Path. Runs entirely in your browser.</span>
      <span>Not a substitute for professional medical advice.</span>
    </footer>

    <script src="shared/data.videos.sb.js?v=20261016-06a3e55"></script>
    <script src="shared/data.videos.nbs.js?v=20261016-06a3e55"></script>
    <script src="shared/drsk_video_data.js?v=20261016-06a3e55"></script>
    <script src="shared/ayushyp_video_data.js?v=20261016-06a3e55"></script>
    <script src="shared/curated_routine_video_data.js?v=20261016-06a3e55"></script>
    <script src="shared/data.videotopics.js?v=20261016-06a3e55"></script>
    <script src="shared/data.activities.js?v=20261016-06a3e55"></script>
    <script src="shared/utils.js?v=20261016-06a3e55"></script>
    <script src="shared/insights.js?v=20261016-06a3e55"></script>
    <script src="shared/videomatch.js?v=20261016-06a3e55"></script>
    <script>
      const state = loadState() || {};
      const profile = state.profile || {};
      const symptoms = profile.symptoms || [];

      renderHeader('great', 'KYH — Next Steps');
      const main = document.getElementById('main-content');

      /* ---------- Video matching: shared/videomatch.js ---------- */

function fmtDuration(sec) {
  if (!sec && sec !== 0) return '';
      const m = Math.floor(sec / 60), s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
      }

      function videoCardHtml(v) {
      const tagsHtml = (v._matched && v._matched.length)
      ? v._matched.slice(0, 3).map(t => `<span class="tag ok">${esc(t)}</span>`).join('')
      : `<span class="tag">Popular</span>`;
      return `
      <div class="video-card">
        <div class="video-thumb-wrap">
          <button type="button" class="video-play" data-vid="${esc(v.id)}" aria-label="Play video: ${esc(v.title)}">
            <img src="${esc(v.thumbnail)}" alt="" loading="lazy" referrerpolicy="no-referrer"
                 onerror="this.onerror=null; this.src='https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg';">
            <span class="video-playicon" aria-hidden="true">&#9654;</span>
            <span class="video-duration">${fmtDuration(v.duration)}</span>
          </button>
        </div>
        <div class="video-title">${esc(v.title)}</div>
        <div class="video-tags">${tagsHtml}</div>
        <a class="video-ext" href="${esc(v.url)}" target="_blank" rel="noopener">Open on YouTube &#8599;</a>
      </div>`;
      }

      function videoSourceBlockHtml(title, videos, idPrefix) {
      if (!videos.length) return '';
      const top  = videos.slice(0, 3);
      const rest = videos.slice(3, 12);
      return `
      <div class="video-source-title">${title}</div>
      <div class="video-grid">${top.map(videoCardHtml).join('')}</div>
      ${rest.length ? `
      <div class="video-grid" id="${idPrefix}-extra" style="display:none; margin-top:12px;">
        ${rest.map(videoCardHtml).join('')}
      </div>
      <button type="button" class="btn secondary" id="${idPrefix}-more-btn"
              data-count="${rest.length}" style="margin-bottom:20px;">
        Show ${rest.length} more, sorted by relevance ↓
      </button>
      ` : ''}`;
      }

      function wireVideoShowMore() {
      VIDEO_SOURCES.forEach(src => { const idPrefix = src.pfx;
      const btn = document.getElementById(idPrefix + '-more-btn');
      if (!btn) return;
      btn.addEventListener('click', () => {
      const extra = document.getElementById(idPrefix + '-extra');
      const showing = extra.style.display !== 'none';
      extra.style.display = showing ? 'none' : 'grid';
      btn.textContent = showing
      ? `Show ${btn.dataset.count} more, sorted by relevance ↓`
      : 'Show fewer ↑';
      });
      });
      }

      function render() {
      if (!profile.sex) {
      main.innerHTML = `<div class="empty-state">
        No profile found. <a href="profile.html">Start here →</a>
      </div>`;
      return;
      }

      const insights = typeof buildInsights === 'function' ? buildInsights(state) : [];
      const aiPrompt = typeof buildInsightAIPrompt === 'function'
      ? buildInsightAIPrompt(state, insights)
      : { full: '', header: '', sections: [] };
      const doctorItems = typeof buildInsightDoctorPrep === 'function'
      ? buildInsightDoctorPrep(insights)
      : [];

      const { symptomTags, contextTags } = deriveInterestTags(state);
      const pickedSources = VIDEO_SOURCES.map(src => ({ ...src, vids: pickTopVideos(window[src.globalVar], symptomTags, contextTags, 12) }));
      const anyVideos = pickedSources.some(src => src.vids.length);

      main.innerHTML = `
      <p class="lede" style="margin-bottom:28px;">
        Actions built from your insights — doctor prep, an AI prompt, and learning matched to your context.
      </p>

      <div class="cat-title" id="doctor">Prepare for your doctor consultation</div>
      <div class="note-block teal" style="margin-bottom:32px;">
        <span class="k">Bring this to your next visit</span>
        <ul style="margin:8px 0 0 18px; padding:0; line-height:1.65;">
          ${doctorItems.map(i => `<li>${esc(i)}</li>`).join('')}
        </ul>
      </div>

      <div class="cat-title" id="ai">AI action prompt</div>
      <p class="lede" style="font-size:14px; margin-bottom:16px;">
        Four ready-to-copy prompts, each starting from the same context. Pick the conversation you want to have.
      </p>

      <div class="field" style="max-width:440px; margin-bottom:16px;">
        <label class="intake-label" for="ai-prompt-select">Choose a prompt</label>
        <select id="ai-prompt-select">
          <option value="all">All three, with shared context</option>
          ${aiPrompt.sections.map(s => `<option value="${esc(s.key)}">${esc(s.label)}</option>`).join('')}
        </select>
      </div>

      <div class="prompt-box" id="ai-prompt-display" tabindex="0" role="region" aria-label="AI prompt text"></div>
      <button type="button" class="btn" id="copy-prompt-btn" style="margin:12px 0 36px;" aria-live="polite">Copy this prompt</button>

      <div class="cat-title" id="learn">Recommended videos</div>
      <p class="lede" style="font-size:14px; margin-bottom:8px;">
        Ranked by relevance to your symptoms and risk profile.
      </p>
      <p style="font-size:12.5px; color:var(--muted); margin:0 0 14px;">These are third-party videos from independent creators, shown for general education. They are not made or endorsed by KYH and are not a substitute for your doctor's advice. Video pictures are loaded from YouTube, so YouTube can see which videos are shown here; KYH itself does not.</p>
      ${pickedSources.map(src => videoSourceBlockHtml(src.label, src.vids, src.pfx)).join('')}
      ${!anyVideos ? `
      <p class="lede" style="color:var(--muted);">No videos in our library match your answers yet.</p>
      ` : ''}

      <div class="page-footer-nav" style="margin-top:48px;">
        <a href="summary.html" class="btn secondary">← Back to Summary</a>
        <a href="index.html" class="btn">Done</a>
      </div>
      `;

      wireVideoShowMore();

      const AI_PROMPT_OPTIONS = { all: aiPrompt.full };
      aiPrompt.sections.forEach(s => { AI_PROMPT_OPTIONS[s.key] = s.withContext; });

      const promptSelect = document.getElementById('ai-prompt-select');
      const promptDisplay = document.getElementById('ai-prompt-display');
      function renderSelectedPrompt() {
      if (!promptSelect || !promptDisplay) return;
      promptDisplay.textContent = AI_PROMPT_OPTIONS[promptSelect.value] || '';
      }
      if (promptSelect) {
      promptSelect.addEventListener('change', renderSelectedPrompt);
      renderSelectedPrompt();
      }

      const copyBtn = document.getElementById('copy-prompt-btn');
      if (copyBtn) {
      copyBtn.addEventListener('click', () => {
      const text = AI_PROMPT_OPTIONS[promptSelect ? promptSelect.value : 'all'] || '';
      navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = 'Copied ✓';
      setTimeout(() => { copyBtn.textContent = 'Copy this prompt'; }, 2000);
      });
      });
      }

      // Honour deep links from summary cards
      // The hash may briefly hold a state payload (#d=...), which is not a valid
      // selector, so only honour plain anchor ids.
      const anchorId = location.hash.replace(/^#/, '');
      if (/^[A-Za-z][\w-]*$/.test(anchorId)) {
      const el = document.getElementById(anchorId);
      if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
      }
      }

      render();
    </script>
  </body>
</html>
