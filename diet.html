<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diet &mdash; KYH</title>
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>

<header class="masthead" id="app-header"></header>

<main id="main-content">
  <div class="empty-state">Loading…</div>
</main>

<footer>
  <span>KYH — Know Your Health. Own Your Path. Runs entirely in your browser.</span>
  <span>Not a substitute for professional medical advice.</span>
</footer>

<script src="shared/utils.js"></script>
<script src="shared/data.diet.js"></script>
<script>
const state   = loadState() || {};
const profile = state.profile || {};
const routine = state.routine || {};
const userSymptoms = profile.symptoms || [];

renderHeader('diet', 'KYH-Diet');

// Restore any previous diet answers for this session
let dietState = Object.assign({
  type: profile.dietType || "",
  cuisine: profile.cuisine || "",
  frequency: {},
  intake: {},  // { [nutrient]: { meeting: "yes"|"partial"|"no" } }
  priorities: [],
  target: null
}, state.diet || {});
// Dietary & cuisine preference now live on the Profile step — always trust
// the profile value over anything stale saved earlier in diet state.
if (profile.dietType) dietState.type = profile.dietType;
if (profile.cuisine)  dietState.cuisine = profile.cuisine;

function saveDietProgress() {
  const next = Object.assign({}, state, { diet: dietState });
  persistState(next);
}

function getExamples(nutrientName) {
  const diet = dietState.type || "Vegetarian";
  const cuisine = dietState.cuisine || "Indian";

  const base = (window.PREF_FOOD_EXAMPLES?.[diet] || {})[nutrientName] || "";
  const extra = (window.CUISINE_EXTRAS?.[cuisine]?.[diet] || {})[nutrientName] || "";

  if (extra) return extra;  // diet-specific regional wins
  return base;
}

function scoreNutrient(n) {
  let score = 0;
  const matched = (n.symptoms || []).filter(s => userSymptoms.includes(s));
  score += matched.length * 12;

  const userProfiles = deriveRiskCategories(profile).cats;
  score += (n.profile || "").split(";").filter(p => userProfiles.includes(p.trim())).length * 8;

  Object.entries(dietState.frequency || {}).forEach(([id, freq]) => {
    const marker = (window.FOOD_QUALITY || []).find(f => f.id === id);
    if (!marker) return;
    if (marker.type === "protective" && (freq === "Rarely" || freq === "1-2x/Wk")) {
      if (marker.nutrientsBoosted.includes(n.nutrient)) score += 5;
    }
    if (marker.type === "harmful" && (freq === "Daily" || freq === "3-5x/Wk")) {
      if (n.nutrient === "Added Sugars / Refined Carbohydrates") score += 11;
    }
  });

  if (isCurrentUse(profile.alcohol) &&
      ["Magnesium","Vitamin B12","Zinc","Protein"].includes(n.nutrient)) score += 4;
  if (isCurrentUse(profile.smoking) &&
      ["Zinc","Omega-3 (EPA/DHA)"].includes(n.nutrient)) score += 3;
  const bmiKind = bmiClass(profile.bmi, profile);
  if ((bmiKind === 'over' || bmiKind === 'obese') &&
      ["Protein","Fibre","Magnesium","Chromium","Omega-3 (EPA/DHA)","Added Sugars / Refined Carbohydrates"].includes(n.nutrient)) score += 6;

  return { score, matched };
}

/* ---------- Render page ---------- */
function renderPage() {
  if (!profile.sex) {
    document.getElementById("main-content").innerHTML =
      `<div class="empty-state">We need your profile first. <a href="profile.html">Go back to start →</a></div>`;
    return;
  }
  if (!profile.dietType || !profile.cuisine) {
    document.getElementById("main-content").innerHTML =
      `<div class="empty-state">We need your dietary &amp; cuisine preference first. <a href="profile.html">Go back to Profile →</a></div>`;
    return;
  }

  const main = document.getElementById("main-content");
  main.innerHTML = `
    <p class="lede" style="margin-bottom:28px;">
      Based on your symptoms, body composition, routine and preferences we prioritise the nutrients that matter most for you right now.
    </p>

    <div class="note-block" style="margin-bottom:28px;">
      <span class="k">Dietary &amp; cuisine preference</span>
      <div style="margin-top:6px;font-size:14px;">
        <b>${profile.dietType}</b> &middot; <b>${profile.cuisine}</b>
        &nbsp;&mdash;&nbsp;<a href="profile.html">change on Profile →</a>
      </div>
    </div>

    <div class="cat-title">Food Quality Markers</div>
    <p class="lede" style="font-size:14px; margin-bottom:16px;">How often do you consume these?</p>
    <div id="markers-container" style="margin-bottom:36px;"></div>

    <div class="cat-title">Nutrient Priorities</div>
    <p class="lede" style="font-size:14px; margin-bottom:16px;" id="priority-meta">Ranked for you</p>
    <div id="nutrient-list"></div>

    <div class="page-footer-nav">
      <a href="routine-plan.html" class="btn secondary">← Back</a>
      <span class="validation-msg" id="validation-msg" style="margin-right:14px;"></span>
      <button type="button" class="btn" id="continue-btn">Synthesize Diet →</button>
    </div>
  `;

  // Food Quality Matrix
  renderFrequencyMatrix();
  // Nutrient cards
  renderNutrients();

  // Frequency matrix change
 document.getElementById("markers-container").addEventListener("change", e => {
    const foodId = e.target.dataset.food;
    if (!foodId) return;

    if (e.target.type === "radio" || e.target.tagName === "SELECT") {
    dietState.frequency[foodId] = e.target.value;
    saveDietProgress();
    renderNutrients();
    }
 });

  // Continue
  document.getElementById("continue-btn").addEventListener("click", () => {
    const msg = document.getElementById("validation-msg");
    if (Object.keys(dietState.frequency || {}).length < (window.FOOD_QUALITY || []).length) {
      msg.textContent = "Please answer all Food Quality markers before continuing.";
      return;
    }
    msg.textContent = "";

    const estBurn = Number(routine.estimatedCalories) || 2200;
    const { cal: targetCal, factor } = estimateTargetCalories(estBurn, profile);
    const waterL = estimateWaterLiters(profile, estBurn);

    dietState.target = {
      cal: targetCal,
      waterL: waterL,
      factor: factor,
      note: `Burn ~${estBurn.toLocaleString()} kcal × ${factor} (body-composition adjusted)`
    };

    dietState.priorities = (window.NUTRIENTS || [])
      .map(n => ({ ...n, ...scoreNutrient(n) }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 10);

    const nextState = Object.assign({}, state, { diet: dietState });
    goTo("diet-synthesis.html", nextState);
  });
}

function renderFrequencyMatrix() {
  const foods = window.FOOD_QUALITY || [];
  const freqs = window.FOOD_QUALITY_OPTIONS || ["Daily", "3-5x/Wk", "1-2x/Wk", "Rarely"];

  // ----- Desktop: radio matrix (unchanged) -----
  let tableHtml = `
    <div class="fq-matrix-wrapper fq-desktop-only">
      <table class="fq-matrix">
        <thead>
          <tr>
            <th>Frequency</th>
            ${foods.map(f => `<th>${f.label}</th>`).join("")}
          </tr>
        </thead>
        <tbody>
  `;
  freqs.forEach(freq => {
    tableHtml += `<tr><th scope="row">${freq}</th>`;
    foods.forEach(food => {
      const checked = dietState.frequency[food.id] === freq ? "checked" : "";
      tableHtml += `
        <td>
          <input type="radio"
                 name="fq_${food.id}"
                 value="${freq}"
                 data-food="${food.id}"
                 ${checked}
                 aria-label="${freq} for ${food.label}">
        </td>`;
    });
    tableHtml += `</tr>`;
  });
  tableHtml += `</tbody></table></div>`;

  // ----- Mobile: one row per food + frequency dropdown -----
  let mobileHtml = `<div class="fq-mobile-list fq-mobile-only">`;
  foods.forEach(food => {
    const current = dietState.frequency[food.id] || "";
    const options = freqs.map(f =>
      `<option value="${f}" ${current === f ? "selected" : ""}>${f}</option>`
    ).join("");

    mobileHtml += `
      <div class="fq-mobile-row">
        <label class="fq-mobile-label" for="fq-sel-${food.id}">${food.label}</label>
        <select id="fq-sel-${food.id}"
                class="fq-mobile-select"
                data-food="${food.id}">
          <option value="">How often?</option>
          ${options}
        </select>
      </div>`;
  });
  mobileHtml += `</div>`;

  document.getElementById("markers-container").innerHTML = tableHtml + mobileHtml;
}

function renderNutrients() {
  const list = document.getElementById("nutrient-list");
  if (!list) return;

  const estBurn = Number(routine.estimatedCalories) || 0;

  const ranked = (window.NUTRIENTS || [])
    .map(n => ({ ...n, ...scoreNutrient(n) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 10);

  const matchedCount = ranked.filter(n => n.matched.length > 0).length;
  const meta = document.getElementById("priority-meta");
  if (meta) {
    meta.textContent = `${ranked.length} nutrients prioritised · ${matchedCount} matched to your symptoms`;
  }

  list.innerHTML = ranked.map((n, idx) => {
    const isLimit = n.direction === "limit";
    const examples = getExamples(n.nutrient);
    const tagClass = isLimit ? "due" : (n.matched.length ? "ok" : "");
    const tagText  = isLimit ? "LIMIT"
      : (n.matched.length ? "MATCHES: " + n.matched.slice(0, 2).join(", ").toUpperCase() : "BASELINE");

    const current = dietState.intake?.[n.nutrient] || {};
    // migrate old tracking → meeting if needed
    const meeting = current.meeting
      || (current.tracking === "yes" ? "yes" : current.tracking === "no" ? "no" : "");

    const targetLabel = isLimit
      ? null
      : nutrientTargetLabel(n.nutrient, profile, estBurn);

    const promptLabel = isLimit
      ? "KEEPING THIS LIMITED?"
      : (targetLabel ? "ARE YOU MEETING THIS?" : "CURRENT INTAKE?");

    const targetHtml = targetLabel
      ? `<div style="margin-top:8px;font-size:13px;">
           <b>Target:</b> ${targetLabel}
           <span style="font-size:11px;color:var(--ink-soft);"> (guide)</span>
         </div>`
      : "";

    return `
      <div class="test-card" data-nutrient="${n.nutrient}">
        <div class="head">
          <div>
            <div class="name">${idx + 1}. ${n.nutrient}</div>
            <div class="test-desc">${n.note}</div>
            <div class="symptom"><b>Watch for:</b> ${(n.symptoms || []).slice(0, 5).join(", ")}</div>
            ${examples ? `
              <div style="margin-top:8px;padding:8px 10px;background:var(--paper);border-radius:4px;font-size:12.5px;">
                <b style="color:var(--teal);">Examples:</b> ${examples}
              </div>` : ""}
            ${targetHtml}
          </div>
          <span class="tag ${tagClass}">${tagText}</span>
        </div>

        <div class="answers">
          <span style="font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;">
            ${promptLabel}
          </span>
          <div class="radio-pair">
            <input type="radio" name="meet_${idx}" id="meet_${idx}_yes" value="yes"
              ${meeting === "yes" ? "checked" : ""}>
            <label for="meet_${idx}_yes">Yes</label>
            <input type="radio" name="meet_${idx}" id="meet_${idx}_partial" value="partial"
              ${meeting === "partial" ? "checked" : ""}>
            <label for="meet_${idx}_partial">Partially</label>
            <input type="radio" name="meet_${idx}" id="meet_${idx}_no" value="no"
              ${meeting === "no" ? "checked" : ""}>
            <label for="meet_${idx}_no">No</label>
          </div>
        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".radio-pair input").forEach(radio => {
    radio.addEventListener("change", function () {
      const card = this.closest(".test-card");
      const nutrient = card.dataset.nutrient;
      if (!dietState.intake) dietState.intake = {};
      dietState.intake[nutrient] = { meeting: this.value };
      saveDietProgress();
    });
  });
}

renderPage();
</script>
</body>
</html>
