<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routine &mdash; KYH</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner" style="display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;">
    <div class="brand-lockup" style="margin-bottom:0;">
      <a href="index.html" style="text-decoration:none;">
        <img src="shared/assets/kyh_logo.jpg" alt="KYH – Know Your Health" style="height:38px; width:auto; display:block;">
      </a>
    </div>
    <div class="map-route" aria-label="Your progress from Fine to Great">
      <div class="map-stop"><div class="map-pin" style="border-color:var(--teal); color:var(--teal);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-6-5.4-6-10a6 6 0 1 1 12 0c0 4.6-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg></div><div class="label">Fine</div></div>
      <div class="map-line"></div>
      <div class="map-stop"><div class="map-pin" style="border-color:var(--teal); color:var(--teal);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></div><div class="label">Diagnostics</div></div>
      <div class="map-line"></div>
      <div class="map-stop active"><div class="map-pin" style="border-color:var(--amber); color:var(--paper); background:var(--amber);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div><div class="label" style="color:var(--ink); font-weight:600;">Routine</div></div>
      <div class="map-line"></div>
      <div class="map-stop"><div class="map-pin" style="border-color:var(--teal); color:var(--teal); opacity:0.45;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></div><div class="label" style="opacity:0.5;">Diet</div></div>
      <div class="map-line"></div>
      <div class="map-stop"><div class="map-pin" style="opacity:0.4;"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17.3 5.7 21.4 8 14 2 9.4h7.6z"/></svg></div><div class="label" style="opacity:0.5;">Great</div></div>
    </div>
  </div>
</header>

<main id="main-content">
  <div class="empty-state">Loading your profile&hellip;</div>
</main>

<footer>
  <span>KYH — Know Your Health. Own Your Path. Runs entirely in your browser.</span>
  <span>Not a substitute for professional medical advice.</span>
</footer>

<script src="shared/data.routine.js"></script>
<script src="shared/utils.js"></script>
<script>
const state = loadState();
const profile = state.profile;
const main = document.getElementById('main-content');

// Helper to get midpoint of an ideal range
function getIdealMid(rangeStr) {
  const [lo, hi] = parseRange(rangeStr);
  if (lo === -Infinity || hi === Infinity) return 0;
  return (Math.round(((lo + hi) / 2) * 2) / 2).toFixed(1); 
}

function init(){
  let idealRow = pickBestRow(window.ROUTINE, profile.sex, profile);
  if(!idealRow) {
    idealRow = { sleep: "7.0-8.5", desk: "4.0-7.0", idle: "0.5-2.0", standing: "0.5-2.0", walking: "0.5-1.5", yoga: "0.0-1.0", exercise: "0.5-1.5", other: "1.0-3.0" };
  }

  const prior = state.routine || {};
  const prevAct = prior.actual || {};
  const prevIdl = prior.ideal || {};
  const prevHabits = prior.habits || {};

  main.innerHTML = `
  <div class="section-head" style="margin-bottom:0; border-bottom:none;">
    <h2>Daily Routine</h2>
    <span class="section-sub">Daily Routine</span>
  </div>
  <p class="lede" style="margin-bottom:24px;">Log your average 24 hours. We've pre-filled the 'Ideal' column based on your physiological profile, but you know your life best — feel free to adjust your targets.</p>

  <div class="ledger-container">
    <div class="ledger-top-bar">
      <h3>1. Your 24 Hours</h3>
      <div class="hour-counter" id="hour-counter">24.0 / 24 hrs</div>
    </div>
    <div class="ledger-header">
      <div>Activity</div>
      <div style="text-align:right;">Actual (hrs)</div>
      <div style="text-align:right;">Ideal (hrs)</div>
      <div style="text-align:right;">Diff</div>
    </div>

    <div class="ledger-group-head">Rest & Focus</div>
    <div class="ledger-row">
      <div class="ledger-label">Sleep<span class="ledger-sub">In bed, resting</span></div>
      <div class="col-actual"><input type="number" class="hour-input actual-input" id="act-sleep" min="0" max="24" step="0.5" value="${prevAct.sleep || ''}"></div>
      <div class="col-ideal"><input type="number" class="hour-input ideal-input" id="idl-sleep" min="0" max="24" step="0.5" value="${prevIdl.sleep || getIdealMid(idealRow.sleep)}"></div>
      <div class="col-diff stock-ticker" id="diff-sleep">━</div>
    </div>
    <div class="ledger-row">
      <div class="ledger-label">Work / Desk<span class="ledger-sub">Sitting, typing, commuting</span></div>
      <div class="col-actual"><input type="number" class="hour-input actual-input" id="act-desk" min="0" max="24" step="0.5" value="${prevAct.desk || ''}"></div>
      <div class="col-ideal"><input type="number" class="hour-input ideal-input" id="idl-desk" min="0" max="24" step="0.5" value="${prevIdl.desk || getIdealMid(idealRow.desk)}"></div>
      <div class="col-diff stock-ticker" id="diff-desk">━</div>
    </div>
    <div class="ledger-row">
      <div class="ledger-label">Idle Sitting<span class="ledger-sub">Watching TV, social media, lounging</span></div>
      <div class="col-actual"><input type="number" class="hour-input actual-input" id="act-idle" min="0" max="24" step="0.5" value="${prevAct.idle || ''}"></div>
      <div class="col-ideal"><input type="number" class="hour-input ideal-input" id="idl-idle" min="0" max="24" step="0.5" value="${prevIdl.idle || getIdealMid(idealRow.idle)}"></div>
      <div class="col-diff stock-ticker" id="diff-idle">━</div>
    </div>

    <div class="ledger-group-head">Active & Upright</div>
    <div class="ledger-row">
      <div class="ledger-label">Chores / Cooking<span class="ledger-sub">Standing, meal prep, cleaning</span></div>
      <div class="col-actual"><input type="number" class="hour-input actual-input" id="act-standing" min="0" max="24" step="0.5" value="${prevAct.standing || ''}"></div>
      <div class="col-ideal"><input type="number" class="hour-input ideal-input" id="idl-standing" min="0" max="24" step="0.5" value="${prevIdl.standing || getIdealMid(idealRow.standing)}"></div>
      <div class="col-diff stock-ticker" id="diff-standing">━</div>
    </div>
    <div class="ledger-row">
      <div class="ledger-label">Walking<span class="ledger-sub">Errands, casual walks</span></div>
      <div class="col-actual"><input type="number" class="hour-input actual-input" id="act-walking" min="0" max="24" step="0.5" value="${prevAct.walking || ''}"></div>
      <div class="col-ideal"><input type="number" class="hour-input ideal-input" id="idl-walking" min="0" max="24" step="0.5" value="${prevIdl.walking || getIdealMid(idealRow.walking)}"></div>
      <div class="col-diff stock-ticker" id="diff-walking">━</div>
    </div>
    <div class="ledger-row">
      <div class="ledger-label">Exercise<span class="ledger-sub">Gym, running, high heart rate</span></div>
      <div class="col-actual"><input type="number" class="hour-input actual-input" id="act-exercise" min="0" max="24" step="0.5" value="${prevAct.exercise || ''}"></div>
      <div class="col-ideal"><input type="number" class="hour-input ideal-input" id="idl-exercise" min="0" max="24" step="0.5" value="${prevIdl.exercise || getIdealMid(idealRow.exercise)}"></div>
      <div class="col-diff stock-ticker" id="diff-exercise">━</div>
    </div>
    <div class="ledger-row">
      <div class="ledger-label">Yoga / Stretching<span class="ledger-sub">Mobility, flow, pilates</span></div>
      <div class="col-actual"><input type="number" class="hour-input actual-input" id="act-yoga" min="0" max="24" step="0.5" value="${prevAct.yoga || ''}"></div>
      <div class="col-ideal"><input type="number" class="hour-input ideal-input" id="idl-yoga" min="0" max="24" step="0.5" value="${prevIdl.yoga || getIdealMid(idealRow.yoga)}"></div>
      <div class="col-diff stock-ticker" id="diff-yoga">━</div>
    </div>

    <div class="ledger-row total-row" style="border-top:1px solid var(--ink);">
      <div class="ledger-label" style="color:var(--teal);">Unallocated Time<span class="ledger-sub">Remaining hours (Auto-calculated)</span></div>
      <div class="col-actual"><input type="number" class="hour-input" id="act-other" readonly tabindex="-1" value="24.0"></div>
      
      <div class="col-ideal"><input type="number" class="hour-input ideal-input" id="idl-other" min="0" max="24" step="0.5" value="${prevIdl.other || getIdealMid(idealRow.other)}"></div>
      
      <div class="col-diff stock-ticker" id="diff-other">━</div>
    </div>

  </div>
  <div class="validation-msg" id="routine-msg" style="color:var(--rose); text-align:right; margin-top:-16px; margin-bottom:24px;"></div>

  <div class="routine-section-title">2. Daily Habits</div>
  <div class="habit-grid">
    <div class="habit-card">
      <div class="habit-card-header">
        <div>
          <div class="k">Daily Steps</div>
          <div class="sub">Ideal baseline: 8,000+</div>
        </div>
        <div class="stock-ticker" id="diff-hab-steps">━</div>
      </div>
      <div class="habit-input-wrap">
        <input type="number" id="hab-steps" step="500" placeholder="e.g. 6000" value="${prevHabits.steps || ''}">
        <span class="unit">steps</span>
      </div>
    </div>
    
    <div class="habit-card">
      <div class="habit-card-header">
        <div>
          <div class="k">Sunlight Exposure</div>
          <div class="sub">Ideal baseline: 20+ mins</div>
        </div>
        <div class="stock-ticker" id="diff-hab-sun">━</div>
      </div>
      <div class="habit-input-wrap">
        <input type="number" id="hab-sun" min="0" step="5" placeholder="e.g. 20" value="${prevHabits.sun || ''}">
        <span class="unit">mins</span>
      </div>
    </div>
    
    <div class="habit-card">
      <div class="habit-card-header">
        <div>
          <div class="k">Dinner before Sleep</div>
          <div class="sub">Ideal baseline: 2.0+ hrs</div>
        </div>
        <div class="stock-ticker" id="diff-hab-dinner">━</div>
      </div>
      <div class="habit-input-wrap">
        <input type="number" id="hab-dinner" min="0" step="0.5" placeholder="e.g. 2.0" value="${prevHabits.dinner || ''}">
        <span class="unit">hrs</span>
      </div>
    </div>
    
    <div class="habit-card" style="justify-content:center;">
      <label class="habit-toggle">
        <input type="checkbox" id="hab-walk" ${prevHabits.postMealWalk ? 'checked' : ''}>
        <span>I take a 10+ min walk after my largest meal</span>
      </label>
    </div>
  </div>

  <div class="routine-section-title">3. Weekly Extras</div>
  <div class="habit-grid">
    <div class="habit-card">
      <div>
        <div class="k">Sports</div>
        <div class="sub">Tennis, soccer, climbing, etc.</div>
      </div>
      <div class="habit-input-wrap">
        <input type="number" id="hab-sports" min="0" step="0.5" placeholder="e.g. 3.0" value="${prevHabits.sports || ''}" class="weekly-input">
        <span class="unit">hrs/week</span>
        <span class="weekly-thumb" id="thumb-sports">👍</span>
      </div>
    </div>
    <div class="habit-card">
      <div>
        <div class="k">Strength Training</div>
        <div class="sub">Weights, resistance, heavy loads</div>
      </div>
      <div class="habit-input-wrap">
        <input type="number" id="hab-strength" min="0" step="0.5" placeholder="e.g. 2.5" value="${prevHabits.strength || ''}" class="weekly-input">
        <span class="unit">hrs/week</span>
        <span class="weekly-thumb" id="thumb-strength">👍</span>
      </div>
    </div>
    <div class="habit-card">
      <div>
        <div class="k">Social / Community</div>
        <div class="sub">Quality time with friends/groups</div>
      </div>
      <div class="habit-input-wrap">
        <input type="number" id="hab-social" min="0" step="1" placeholder="e.g. 5" value="${prevHabits.social || ''}" class="weekly-input">
        <span class="unit">hrs/week</span>
        <span class="weekly-thumb" id="thumb-social">👍</span>
      </div>
    </div>
  </div>
  <div class="page-footer-nav" style="border-top:none; padding-top:0;">
    <a href="diagnostics.html" class="btn secondary">&larr; Back</a>
    <button type="button" class="btn" id="continue-btn">Continue to Diet &rarr;</button>
  </div>
  `;

  const activityKeys = ['sleep', 'desk', 'idle', 'standing', 'walking', 'exercise', 'yoga'];
  const actualInputs = document.querySelectorAll('.actual-input');
  const idealInputs = document.querySelectorAll('.ideal-input');
  const actOther = document.getElementById('act-other');
  const idlOther = document.getElementById('idl-other');
  const hourCounter = document.getElementById('hour-counter');
  const msg = document.getElementById('routine-msg');
  const continueBtn = document.getElementById('continue-btn');

// Updated diff function with dynamic decimals
  function getDiffHTML(act, idl, isBadToIncrease, decimals = 1) {
    if (isNaN(act) || isNaN(idl)) return '<span style="color:var(--muted);">━</span>';
    const diff = act - idl;
    
    // Use a small epsilon to catch floating point zero
    if (Math.abs(diff) < 0.1) {
      return `<span style="color:var(--muted);">━ ${Number(0).toFixed(decimals)}</span>`;
    } else if (diff > 0) {
      const color = isBadToIncrease ? 'var(--rose)' : 'var(--teal)';
      return `<span style="color:${color};">▲ +${diff.toFixed(decimals)}</span>`;
    } else {
      const color = isBadToIncrease ? 'var(--teal)' : 'var(--rose)';
      return `<span style="color:${color};">▼ ${diff.toFixed(decimals)}</span>`;
    }
  }

  // --- NEW LOGIC FOR HABITS & THUMBS ---
  function updateHabitsAndExtras() {
    // 1. Calculate Daily Habit Tickers (Higher is better for all of these, so isBadToIncrease = false)
    const steps = parseFloat(document.getElementById('hab-steps').value);
    document.getElementById('diff-hab-steps').innerHTML = getDiffHTML(steps, 8000, false, 0);

    const sun = parseFloat(document.getElementById('hab-sun').value);
    document.getElementById('diff-hab-sun').innerHTML = getDiffHTML(sun, 20, false, 0);

    const dinner = parseFloat(document.getElementById('hab-dinner').value);
    document.getElementById('diff-hab-dinner').innerHTML = getDiffHTML(dinner, 2.0, false, 1);

    // 2. Toggle Weekly Extras Thumbs Up
    ['sports', 'strength', 'social'].forEach(id => {
      const val = parseFloat(document.getElementById(`hab-${id}`).value) || 0;
      const thumb = document.getElementById(`thumb-${id}`);
      if (val > 0) {
        thumb.classList.add('active');
      } else {
        thumb.classList.remove('active');
      }
    });
  }

  // Attach listeners to all the new inputs
  document.getElementById('hab-steps').addEventListener('input', updateHabitsAndExtras);
  document.getElementById('hab-sun').addEventListener('input', updateHabitsAndExtras);
  document.getElementById('hab-dinner').addEventListener('input', updateHabitsAndExtras);
  
  document.querySelectorAll('.weekly-input').forEach(input => {
    input.addEventListener('input', updateHabitsAndExtras);
  });

  // Run on init to catch any pre-filled data
  updateHabitsAndExtras();

function recalculateLedger() {
    let actTotal = 0;

    // Calculate Totals for the specified activities
    activityKeys.forEach(key => {
      actTotal += (parseFloat(document.getElementById(`act-${key}`).value) || 0);
    });

    // Determine the actual remaining/unallocated time
    const remaining = 24 - actTotal;
    const actLeftover = Math.max(0, remaining);
    actOther.value = actLeftover.toFixed(1);

    // Update Top Counter (Countdown logic)
    if (remaining < 0) {
      hourCounter.textContent = `Over by ${Math.abs(remaining).toFixed(1)} hrs`;
      hourCounter.classList.add('over');
      msg.textContent = "Over 24 hours logged. Please reduce some actuals.";
      continueBtn.disabled = true;
    } else if (remaining === 0) {
      hourCounter.textContent = `0.0 hrs unallocated`;
      hourCounter.classList.remove('over');
      msg.textContent = "";
      continueBtn.disabled = false;
    } else {
      hourCounter.textContent = `${remaining.toFixed(1)} hrs unallocated`;
      hourCounter.classList.remove('over');
      msg.textContent = "";
      continueBtn.disabled = false;
    }

    // Update Stock Tickers for normal rows
    activityKeys.forEach(key => {
      const act = parseFloat(document.getElementById(`act-${key}`).value);
      const idl = parseFloat(document.getElementById(`idl-${key}`).value);
      const isBadToIncrease = (key === 'desk' || key === 'idle'); // Health Context
      document.getElementById(`diff-${key}`).innerHTML = getDiffHTML(act, idl, isBadToIncrease);
    });
    
    // Update Stock Ticker for Unallocated row (comparing Auto-Actual vs Custom-Ideal)
    const idlLeftover = parseFloat(document.getElementById('idl-other').value) || 0;
    document.getElementById(`diff-other`).innerHTML = getDiffHTML(actLeftover, idlLeftover, false);
  }

  // Attach auto-calc listeners
  actualInputs.forEach(input => input.addEventListener('input', recalculateLedger));
  idealInputs.forEach(input => input.addEventListener('input', recalculateLedger));
  recalculateLedger(); // Run on init

  // Save State and continue
  continueBtn.addEventListener('click', ()=>{
    const routineState = {
      actual: {
        sleep: parseFloat(document.getElementById('act-sleep').value) || 0,
        desk: parseFloat(document.getElementById('act-desk').value) || 0,
        idle: parseFloat(document.getElementById('act-idle').value) || 0,
        standing: parseFloat(document.getElementById('act-standing').value) || 0,
        walking: parseFloat(document.getElementById('act-walking').value) || 0,
        exercise: parseFloat(document.getElementById('act-exercise').value) || 0,
        yoga: parseFloat(document.getElementById('act-yoga').value) || 0,
        other: parseFloat(actOther.value) || 0
      },
      ideal: {
        sleep: parseFloat(document.getElementById('idl-sleep').value) || 0,
        desk: parseFloat(document.getElementById('idl-desk').value) || 0,
        idle: parseFloat(document.getElementById('idl-idle').value) || 0,
        standing: parseFloat(document.getElementById('idl-standing').value) || 0,
        walking: parseFloat(document.getElementById('idl-walking').value) || 0,
        exercise: parseFloat(document.getElementById('idl-exercise').value) || 0,
        yoga: parseFloat(document.getElementById('idl-yoga').value) || 0,
        other: parseFloat(idlOther.value) || 0
      },
      habits: {
        steps: parseFloat(document.getElementById('hab-steps').value) || null,
        sun: parseFloat(document.getElementById('hab-sun').value) || null,
        dinner: parseFloat(document.getElementById('hab-dinner').value) || null,
        postMealWalk: document.getElementById('hab-walk').checked,
        sports: parseFloat(document.getElementById('hab-sports').value) || 0,
        strength: parseFloat(document.getElementById('hab-strength').value) || 0,
        social: parseFloat(document.getElementById('hab-social').value) || 0
      }
    };

    const next = Object.assign({}, state, { routine: routineState });
    goTo('diet.html', next);
  });
}

if(!profile){
  main.innerHTML = `<div class="empty-state">We need your profile first. <a href="profile.html">Go back to start &rarr;</a></div>`;
} else {
  init();
}
</script>
</body>
</html>
