<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="description" content="Tell KYH about a typical day: sleep, work, movement and exercise. Your estimated daily energy use is worked out as you go.">
      <title>Daily Routine — KYH</title>
     <link rel="stylesheet" href="shared/styles.css?v=20261015-370d515">
<!-- share:start -->
<link rel="icon" href="shared/assets/kyh_logo_final.png?v=20261015-370d515">
<meta name="theme-color" content="#1f7a6d">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KYH — Know Your Health">
<meta property="og:title" content="Daily Routine — KYH">
<meta property="og:description" content="Tell KYH about a typical day: sleep, work, movement and exercise. Your estimated daily energy use is worked out as you go.">
<meta property="og:url" content="https://vividnova.com/3DHealth/routine.html">
<meta property="og:image" content="https://vividnova.com/3DHealth/shared/assets/og-image.png?v=20261015-370d515">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- share:end -->
</head>
  <body>

    <header class="masthead" id="app-header"></header>

    <main id="main-content">
      <div class="empty-state">Loading your profile&hellip;</div>
    </main>

    <footer id="app-footer"></footer>

    <script src="shared/data.activities.js?v=20261015-370d515"></script>
    <script src="shared/utils.js?v=20261015-370d515"></script>
    <script>
      const state = loadState();
      const profile = state.profile;
      const main = document.getElementById('main-content');
      renderHeader('routine', 'KYH-Daily Routine');
      renderFooter();

      const weightKg = Number(profile && profile.weightKg) || 70;
      const defOf = id => window.ACTIVITIES.find(a => a.id === id);
      const catIds = c => window.ACTIVITIES.filter(a => a.category === c).map(a => a.id);

      /* Each question groups activities of a similar kind and effort. "daily" sections ask
         how long a day; "weekly" sections ask days a week and how long each time. */
      const WORK_IDS = ['act_015', 'act_027', 'act_028', 'act_023'];
      const LABEL = { act_015: 'Desk, computer or study', act_027: 'On my feet: teaching, retail, nursing, kitchen', act_028: 'Physical work: construction, farming, delivery', act_023: 'Looking after children or family', act_013: 'Bus, train or passenger', act_014: 'Driving', act_022: 'Standing (at a desk or on the move)', act_012: 'Watching TV or lying down', act_017: 'Sitting and relaxing', act_501: 'Wheelchair (manual)' };
      const SECTIONS = [
        { key: 'main',   title: 'Your work and daytime', q: 'What takes up your day? Choose all that apply.', mode: 'daily', ids: WORK_IDS },
        { key: 'home',   title: 'At home and free time', q: 'Which of these do you do on most days?', mode: 'daily', ids: ['act_002', 'act_016', 'act_004', 'act_005', 'act_012', 'act_017', 'act_018', 'act_212'] },
        { key: 'travel', title: 'Getting around', q: 'Do you spend time travelling on a normal day?', hint: 'If you walk to work or school, add it under Walking below.', mode: 'daily', ids: ['act_014', 'act_013'] },
        { key: 'walk',   title: 'Walking and moving about', q: 'Do you walk or stay on your feet outside work?', mode: 'daily', ids: ['act_101', 'act_102', 'act_103', 'act_025', 'act_026', 'act_022', 'act_501'] },
        { key: 'mind',   title: 'Mind and body', q: 'Do you practise any of these?', mode: 'weekly', ids: ['act_211', 'act_203', 'act_208', 'act_210', 'act_209'] },
        { key: 'gym',    title: 'Gym and fitness', q: 'Do you do any of these?', mode: 'weekly', ids: catIds('Gym & Vigorous') },
        { key: 'sport',  title: 'Sports', q: 'Do you play any of these?', mode: 'weekly', ids: catIds('Sports & Agility'),
          note: 'Practice, gym and sport are counted per week and shown to your doctor. They are not part of the daily energy figure above.' }
      ];
      const SEC_OF = {}; SECTIONS.forEach(s => s.ids.forEach(id => SEC_OF[id] = s));

      const DAILY_OPTS = [[15,'15 min'],[30,'30 min'],[45,'45 min'],[60,'1 h'],[90,'1.5 h'],[120,'2 h'],[180,'3 h']];
      const WORK_OPTS  = [[120,'2 h'],[240,'4 h'],[360,'6 h'],[480,'8 h'],[600,'10 h'],[720,'12 h']];
      const CARE_OPTS  = [[60,'1 h'],[120,'2 h'],[180,'3 h'],[240,'4 h'],[360,'6 h'],[480,'8 h']];
      const WORK_DEFAULT = { act_015: 480, act_027: 480, act_028: 480, act_023: 120 };
      const EACH_OPTS  = [[15,'15 min'],[30,'30 min'],[45,'45 min'],[60,'1 h'],[90,'1.5 h'],[120,'2 h']];
      const DAYS_OPTS  = [1,2,3,4,5,6,7].map(n => [n, String(n)]);
      const SLEEP_OPTS = [4,5,6,7,8,9,10];

      // Nothing is pre-filled: only what the person chooses.
      let sleepH = null;
      let items = [];            // { id, freq, mins (per day or per session), perWeek? }
      let habits = {};

      const nameOf = id => LABEL[id] || (defOf(id) || {}).name || id;
      const find = id => items.find(a => a.id === id);
      const minsOf = a => Number(a.mins) || 0;
      const hhmm = m => ({ hours: Math.floor(m / 60), mins: Math.round(m % 60) });

      function restore() {
        const r = state.routine;
        habits = (r && r.habits) || {};
        // A pre-filled placeholder week from an earlier version is not the person's data.
        if (!r || !Array.isArray(r.activities) || r.activitiesConfirmed === false) return;
        r.activities.forEach(a => {
          if (!defOf(a.id)) return;
          const m = (Number(a.hours) || 0) * 60 + (Number(a.mins) || 0);
          if (a.id === 'act_011') { sleepH = m / 60 || null; return; }
          const sec = SEC_OF[a.id];
          if (!sec) return;
          if (sec.mode === 'weekly') items.push({ id: a.id, freq: 'weekly', mins: m || 30, perWeek: a.freq === 'weekly' ? (Number(a.perWeek) || 3) : 7 });
          else items.push({ id: a.id, freq: 'daily', mins: m });
        });
      }

      function ledger() {
        const daily = items.filter(a => a.freq === 'daily');
        const acts = [];
        if (sleepH) acts.push({ id: 'act_011', freq: 'daily', hours: Math.floor(sleepH), mins: 0 });
        daily.forEach(a => acts.push(Object.assign({ id: a.id, freq: 'daily' }, hhmm(a.mins))));
        const logged = (sleepH || 0) + daily.reduce((s, a) => s + a.mins / 60, 0);
        return { logged, rest: Math.max(0, 24 - logged), acts, burn: acts.length ? estimateTdeeFromActivities(acts, weightKg, undefined, profile) : 0 };
      }

      function readHabits() {
        const num = id => { const el = document.getElementById(id); const v = el ? parseFloat(el.value) : NaN; return isNaN(v) ? null : v; };
        const pm = document.getElementById('hab-post-meal');
        return pm ? { steps: num('hab-steps'), sun: num('hab-sun'), dinner: num('hab-dinner'), postMealWalk: pm.checked === true } : habits;
      }

      function buildRoutine() {
        const L = ledger();
        const weekly = items.filter(a => a.freq === 'weekly').map(a => Object.assign({ id: a.id, freq: 'weekly', perWeek: a.perWeek || 3 }, hhmm(a.mins)));
        return Object.assign({}, state.routine || {}, {
          activities: L.acts.concat(weekly), activitiesConfirmed: true,
          estimatedCalories: L.burn, unloggedHours: Math.round(L.rest * 4) / 4, habits: readHabits()
        });
      }

      /* ---------- markup, all from the app's own classes ---------- */
      function radios(name, label, opts, cur) {
        return `<div class="rt-q"><span class="intake-label" style="margin:0;" id="${name}-l">${esc(label)}</span>
          <div class="radio-pair" role="radiogroup" aria-labelledby="${name}-l">${opts.map(([v, t]) =>
            `<input type="radio" name="${name}" id="${name}-${v}" value="${v}"${Number(cur) === Number(v) ? ' checked' : ''}><label for="${name}-${v}">${esc(t)}</label>`).join('')}</div></div>`;
      }
      function chip(id, label, on, kind) {
        return `<button type="button" class="browse-chip${on ? ' selected' : ''}" data-kind="${kind}" data-id="${esc(id)}" aria-pressed="${on}">${esc(label)}</button>`;
      }
      function detailCard(a, sec) {
        const d = defOf(a.id), mk = a.id.replace(/\W/g, '');
        if (sec && sec.mode === 'weekly') return `<div class="test-card"><div class="name">${esc(nameOf(a.id))}</div><div class="symptom">${d.met.toFixed(1)} METs</div>
          ${radios('pw-' + mk, 'Days a week', DAYS_OPTS, a.perWeek || 3)}${radios('ln-' + mk, 'Each time', EACH_OPTS, a.mins)}</div>`;
        const opts = a.id === 'act_023' ? CARE_OPTS : WORK_DEFAULT[a.id] ? WORK_OPTS : DAILY_OPTS;
        return `<div class="test-card"><div class="name">${esc(nameOf(a.id))}</div><div class="symptom">${d.met.toFixed(1)} METs</div>
          ${radios('hd-' + mk, WORK_DEFAULT[a.id] ? 'Hours a day' : 'How long a day?', opts, a.mins)}</div>`;
      }

      function renderSections(focusSel) {
        const sleep = `<div class="cat-title">Sleep</div>
          <p class="lede" style="font-size:15px;margin-bottom:12px;">How many hours do you usually sleep?</p>
          <div class="browse-grid" role="group" aria-label="Hours of sleep">${SLEEP_OPTS.map(h => chip('sleep-' + h, h + ' h', sleepH === h, 'sleep')).join('')}</div>`;
        const secs = SECTIONS.map(sec => `<div class="cat-title">${esc(sec.title)}</div>
          <p class="lede" style="font-size:15px;margin-bottom:12px;">${esc(sec.q)}</p>
          ${sec.hint ? `<p class="rt-hint" style="margin-top:-6px;margin-bottom:12px;">${esc(sec.hint)}</p>` : ''}
          <div class="browse-grid" role="group" aria-label="${esc(sec.title)}">${sec.ids.map(id => chip(id, nameOf(id), !!find(id), 'act')).join('')}</div>
          ${items.filter(a => SEC_OF[a.id] === sec).map(a => detailCard(a, sec)).join('')}
          ${sec.note && items.some(a => a.freq === 'weekly') ? `<p class="rt-hint">${esc(sec.note)}</p>` : ''}`).join('');
        document.getElementById('rt-secs').innerHTML = sleep + secs;
        if (focusSel) { const el = document.querySelector(focusSel); if (el) el.focus(); }
        updateSummary();
      }

      function updateSummary() {
        const L = ledger(), over = L.logged > 24.1;
        document.getElementById('rt-sum').innerHTML = `
          <div class="stat-card hero"><div class="k">Est. Daily Energy Use</div><div class="v">~${L.burn.toLocaleString()}</div><div class="u">kcal / day</div></div>
          <div class="stat-card"><div class="k">Hours Described</div><div class="v"${over ? ' style="color:var(--rose)"' : ''}>${L.logged.toFixed(1)}</div><div class="u">out of 24 hrs</div></div>`;
        const t = document.getElementById('rt-tally');
        if (t) {
          t.textContent = `${L.logged.toFixed(1)} / 24 hrs described`;
          t.classList.toggle('over', over);
        }
        const nd = document.getElementById('rt-nudge');
        if (nd) nd.textContent = L.logged > 0
          ? `You have described ${L.logged.toFixed(1)} of 24 hours.` + (L.rest > 0.05 ? ` The other ${L.rest.toFixed(1)} hours are counted as light activity.` : '') +
            ` Your estimated daily energy use is about ${L.burn.toLocaleString()} kcal. Take a moment to check whether you would like to adjust any hours so they describe your typical day.`
          : '';
        document.getElementById('rt-over').textContent = over ? `That adds up to more than 24 hours. Shorten something so the day fits.` : '';
        const tm = document.getElementById('time-msg'); if (tm && !over) tm.textContent = '';
      }

      function onChip(btn) {
        const kind = btn.dataset.kind, id = btn.dataset.id;
        if (kind === 'sleep') sleepH = sleepH === Number(id.slice(6)) ? null : Number(id.slice(6));
        else {
          const i = items.findIndex(a => a.id === id);
          if (i >= 0) items.splice(i, 1);
          else items.push(SEC_OF[id].mode === 'weekly' ? { id, freq: 'weekly', mins: 30, perWeek: 3 } : { id, freq: 'daily', mins: WORK_DEFAULT[id] || 60 });
        }
        renderSections('[data-kind="' + kind + '"][data-id="' + CSS.escape(id) + '"]');
      }

      function onRadio(inp) {
        const m = inp.name.match(/^(pw|ln|hd)-(.+)$/); if (!m) return;
        const a = items.find(x => x.id.replace(/\W/g, '') === m[2]); if (!a) return;
        if (m[1] === 'pw') a.perWeek = Number(inp.value); else a.mins = Number(inp.value);
        updateSummary();
      }

      function init() {
        restore();
        main.innerHTML = `
          <div class="section-head"><h2>Your typical day</h2></div>
          <p class="lede">Answer a few quick questions about a normal day. You do not need to add up to 24 hours: anything we do not ask about is counted as light time, like sitting, standing and moving about (about 1.5 METs).</p>
          <div class="stat-strip" id="rt-sum"></div>
          <p class="rt-hint">Worked out from your age, height, weight and sex, scaled by how active each part of your day is. It is an estimate, not a measurement.</p>
          <p class="rt-hint" id="rt-over" style="color:var(--rose);" aria-live="polite"></p>
          <div id="rt-secs"></div>

          <div class="cat-title">Daily signals</div>
          <p class="lede" style="font-size:14px; margin-bottom:16px;">Optional. These fine-tune your insights beyond the activity list.</p>
          <div class="field-row" style="margin-bottom:18px;">
            <div class="field"><label class="intake-label" for="hab-steps">Steps per day</label>
              <input type="number" id="hab-steps" min="0" max="40000" step="500" placeholder="e.g. 6000"></div>
            <div class="field"><label class="intake-label" for="hab-sun">Daylight outdoors</label>
              <input type="number" id="hab-sun" min="0" max="300" step="5" placeholder="minutes / day"></div>
            <div class="field"><label class="intake-label" for="hab-dinner">Dinner &rarr; sleep gap</label>
              <input type="number" id="hab-dinner" min="0" max="8" step="0.5" placeholder="hours"></div>
          </div>
          <div class="check-field" style="margin-bottom:12px;"><input type="checkbox" id="hab-post-meal"><label for="hab-post-meal">I usually walk 10+ minutes after my largest meal</label></div>
          <div class="note-block teal" style="margin-bottom:28px;">Steps, daylight, and meal timing affect recovery and glucose in ways an activity list does not capture.
            <p id="rt-nudge" style="margin:10px 0 0;" aria-live="polite"></p></div>

          <div class="validation-msg alert-banner" id="time-msg" aria-live="polite"></div>
          <div class="rt-tally-row"><span id="rt-tally"></span></div>
          <div class="page-footer-nav">
            <a href="#" id="back-btn" class="btn secondary">&larr; Back</a>
            <button type="button" class="btn" id="continue-btn">Get Movement Plan &rarr;</button>
          </div>`;
        if (habits.steps != null) document.getElementById('hab-steps').value = habits.steps;
        if (habits.sun != null) document.getElementById('hab-sun').value = habits.sun;
        if (habits.dinner != null) document.getElementById('hab-dinner').value = habits.dinner;
        if (habits.postMealWalk) document.getElementById('hab-post-meal').checked = true;
        renderSections();

        const secs = document.getElementById('rt-secs');
        secs.addEventListener('click', e => { const b = e.target.closest('.browse-chip'); if (b) onChip(b); });
        secs.addEventListener('change', e => { if (e.target.type === 'radio') onRadio(e.target); });

        document.getElementById('back-btn').addEventListener('click', e => {
          e.preventDefault();
          goTo('diagnostics.html', Object.assign({}, state, { routine: buildRoutine() }));
        });
        document.getElementById('continue-btn').addEventListener('click', () => {
          const msg = document.getElementById('time-msg');
          const fail = (t, el) => { msg.style.color = 'var(--rose)'; msg.textContent = t; (el || msg).scrollIntoView({ block: 'center' }); if (el && el.focus) el.focus(); };
          const CHECKS = [['hab-steps', 'Steps per day', 0, 40000], ['hab-sun', 'Daylight outdoors', 0, 300], ['hab-dinner', 'Dinner to sleep gap', 0, 8]];
          for (const [id, label, min, max] of CHECKS) {
            const el = document.getElementById(id);
            if (!el || el.value === '') continue;
            const v = parseFloat(el.value);
            if (isNaN(v) || v < min || v > max) return fail(`${label} looks out of range. Please enter a value between ${min} and ${max}.`, el);
          }
          if (sleepH == null) return fail('Please choose how long you usually sleep.', document.querySelector('[data-kind="sleep"]'));
          if (!items.length) return fail('Please add at least one thing you do on a normal day, such as work, cooking or a walk.', document.querySelector('#rt-secs .browse-chip:not([data-kind=sleep])'));
          const L = ledger();
          if (L.logged > 24.1) return fail(`You have described ${L.logged.toFixed(1)} hours in a day. Please shorten something so it fits in 24.`);
          msg.textContent = '';
          goTo('routine-plan.html', Object.assign({}, state, { routine: buildRoutine() }));
        });
      }

      if (!profile) {
        main.innerHTML = `<div class="empty-state">We need your profile first. <a href="profile.html">Go back to start &rarr;</a></div>`;
      } else {
        init();
      }
    </script>
  </body>
</html>
