<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symptoms &mdash; Vital Framework</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner" style="display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;">
    
    <div class="brand-lockup" style="margin-bottom:0;">
      <a href="index.html" style="text-decoration:none;">
        <img src="shared/assets/kyh_logo.jpg" alt="KYH – Know Your Health" style="height:38px; width:auto; display:block;">
      </a>
    </div>

    <div class="map-route" aria-label="Your progress from Fine to Great">
      <div class="map-stop active">
        <div class="map-pin">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 21s-6-5.4-6-10a6 6 0 1 1 12 0c0 4.6-6 10-6 10z"/>
            <circle cx="12" cy="11" r="2.2"/>
          </svg>
        </div>
        <div class="label">Fine</div>
      </div>

      <div class="map-line"></div>

      <div class="map-stop">
        <div class="map-pin" style="border-color:var(--teal); color:var(--teal); opacity:0.45;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
          </svg>
        </div>
        <div class="label" style="opacity:0.5;">Diagnostics</div>
      </div>

      <div class="map-line"></div>

      <div class="map-stop">
        <div class="map-pin" style="border-color:var(--amber); color:var(--amber); opacity:0.45;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3.5 2"/>
          </svg>
        </div>
        <div class="label" style="opacity:0.5;">Routine</div>
      </div>

      <div class="map-line"></div>

      <div class="map-stop">
        <div class="map-pin" style="border-color:var(--teal); color:var(--teal); opacity:0.45;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="4"/>
          </svg>
        </div>
        <div class="label" style="opacity:0.5;">Diet</div>
      </div>

      <div class="map-line"></div>

      <div class="map-stop">
        <div class="map-pin" style="opacity:0.4;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17.3 5.7 21.4 8 14 2 9.4h7.6z"/>
          </svg>
        </div>
        <div class="label" style="opacity:0.5;">Great</div>
      </div>
    </div>
  </div>
</header>



<main id="main-content">
  <div class="empty-state" id="loading-state">Loading your profile&hellip;</div>
</main>

<footer>
  <span>Vital Framework &mdash; runs entirely in your browser. No data leaves this page.</span>
  <span>Not a substitute for professional medical advice.</span>
</footer>

<script src="shared/data.diagnostics.js"></script>
<script src="shared/utils.js"></script>
<script>
const state = loadState();
const profile = state.profile;
const main = document.getElementById('main-content');

/* Symptom categories, validated to cover the full vocabulary derived from DIAG with
   no gaps and no duplicates (each test's symptoms[] array is the single source of truth). */
const CATEGORIES = [
  {name:'Energy, Sleep & Mood', items:['Insomnia','Fatigue','Low Energy','Restlessness','Stress','Anxiety','Depression','Mood Swings','Irritability','Burnout','Snoring']},
  {name:'Musculoskeletal & Joints', items:['Back Pain','Neck Pain','Shoulder Pain','Knee Pain','Hip Pain','Leg Pain','Leg Cramps','Sciatica','Arthritis','Osteoporosis','Carpal Tunnel','Frozen Shoulder','Joint Stiffness','Poor Posture','Slouching','Weak Core','Muscle Weakness','Balance Issues','Sports Injury','Sprain','Strain','Recovery Fatigue','Overtraining','Plantar Fasciitis']},
  {name:'Digestive', items:['Indigestion','Acid Reflux','Constipation','Diarrhea','Bloating','Irritable Bowel Syndrome','Gastritis','Ulcer','Nausea','Vomiting','Gut Health','Hemorrhoids','Loss of Appetite','Blood in Stool']},
  {name:'Heart & Circulation', items:['High Blood Pressure','Low Blood Pressure','Heart Palpitations','Chest Pain','Poor Circulation','Varicose Veins','Edema','Swelling','Fainting / Passing Out']},
  {name:'Weight & Metabolic', items:['Obesity','Overweight','Underweight','Weight Loss','Diabetes','High Cholesterol','Sugar Cravings','Emotional Eating','Excessive Thirst']},
  {name:'Hormonal & Reproductive', items:['Thyroid Disorder','PCOS','Menstrual Pain','Menopause Symptoms','Hot Flashes','Night Sweats','Infertility','Pregnancy Discomfort','Postpartum Recovery']},
  {name:'Head & Neurological', items:['Migraine','Headache','Vertigo','Memory Loss','Poor Concentration','Brain Fog','Cognitive Decline','Parkinson\u2019s Symptoms','Numbness or Tingling']},
  {name:'Respiratory & Allergy', items:['Asthma','Bronchitis','Shortness of Breath','Allergies','Cold','Sinus Congestion','Chronic Cough']},
  {name:'Skin & Hair', items:['Skin Acne','Eczema','Psoriasis','Dry Skin','Hair Loss','Dandruff','Itching','Skin Rash','Bruising Easily','Sweaty Hands']},
  {name:'Urinary, Liver & Kidney', items:['Urinary Tract Infection','Kidney Stones','Frequent Urination','Liver Disorder','Fatty Liver','Gallstones','Pancreatitis']},
  {name:'Eyes, Ears & Mouth', items:['Eye Strain','Eye Dryness','Hearing Loss','Dental Pain','Jaw Pain','Blurry Vision','Ringing in Ears']},
  {name:'Immune & General', items:['Immune Weakness','Frequent Infections','Fever','Inflammation','Cold Intolerance','Heat Intolerance','Palpable Lump']}
];
const SYMPTOM_LIST_RAW = [...new Set(DIAG.flatMap(d=>d.symptoms||[]))].sort();
const FEMALE_ONLY = new Set(['PCOS','Menstrual Pain','Menopause Symptoms','Pregnancy Discomfort','Postpartum Recovery']);
const isMale = profile && profile.sex === 'Male';
const SYMPTOM_LIST = isMale ? SYMPTOM_LIST_RAW.filter(s=>!FEMALE_ONLY.has(s)) : SYMPTOM_LIST_RAW;
if(isMale){
  CATEGORIES.forEach(c=>{ c.items = c.items.filter(s=>!FEMALE_ONLY.has(s)); });
}

let selectedSymptoms = new Set((profile && profile.symptoms) || []);
const vitals = state.vitals || {};
let activeCat = 'All';
let searchQuery = '';

function init(){
  main.innerHTML = `
  <div class="section-head">
    <h2>Search or browse</h2>
    <span class="section-sub">Starting point &middot; Symptoms</span>
  </div>
  <p class="lede">Add anything you're currently experiencing. This shapes your diagnostics test list, and adds a note or two on your diet and routine pages where relevant. Nothing to add? Skip it &mdash; we'll use your risk profile instead.</p>

  <div class="symptom-search-full" style="position:sticky; top:0; background:var(--paper); padding:16px 0; z-index:10; border-bottom:1px solid var(--line);">
    <input type="text" id="symptom-input" class="field" placeholder="Search all symptoms&hellip;" autocomplete="off">
  </div>

  <div class="symptom-split-layout" style="margin-bottom: 36px;">
    
    <div class="cat-sidebar" id="cat-sidebar">
      <button type="button" class="cat-side-btn active" data-cat="All">All Categories</button>
      ${CATEGORIES.map(c=>`<button type="button" class="cat-side-btn" data-cat="${esc(c.name)}">${esc(c.name)}</button>`).join('')}
    </div>

    <div id="browse-wrapper">
      <div class="browse-grid" id="browse-grid"></div>
    </div>

  </div>

  <div class="cat-title">Selected</div>
  <div class="chips-row" id="symptom-chips"></div>
  <p class="symptom-empty-hint" id="symptom-hint"></p>

  <div class="cat-title">Known vitals (optional)</div>
  <p class="lede" style="margin-bottom:14px;">If you know these offhand, they sharpen your diagnostics and show up in your next steps. No harm in leaving them as unknown.</p>
  <div class="field-row" style="max-width:520px;">
    <div class="field">
      <label class="intake-label" for="f-fasting-sugar">Fasting blood sugar (mg/dL)</label>
      <input type="number" id="f-fasting-sugar" min="40" max="400" placeholder="e.g. 92" ${vitals.fastingSugarUnknown?'disabled':''} value="${vitals.fastingSugar!==undefined && vitals.fastingSugar!==null ? vitals.fastingSugar : ''}">
      <div class="check-field" style="margin-top:8px;">
        <input type="checkbox" id="f-fasting-sugar-unknown" ${vitals.fastingSugarUnknown?'checked':''}>
        <label for="f-fasting-sugar-unknown" style="font-size:12px;">Not tested / unknown</label>
      </div>
    </div>
    <div class="field">
      <label class="intake-label" for="f-resting-hr">Resting heart rate (bpm)</label>
      <input type="number" id="f-resting-hr" min="30" max="220" placeholder="e.g. 68" ${vitals.restingHRUnknown?'disabled':''} value="${vitals.restingHR!==undefined && vitals.restingHR!==null ? vitals.restingHR : ''}">
      <div class="check-field" style="margin-top:8px;">
        <input type="checkbox" id="f-resting-hr-unknown" ${vitals.restingHRUnknown?'checked':''}>
        <label for="f-resting-hr-unknown" style="font-size:12px;">Not tested / unknown</label>
      </div>
    </div>
  </div>

  <div class="page-footer-nav">
    <a href="profile.html" class="btn secondary">&larr; Back</a>
    <button type="button" class="btn" id="continue-btn">Continue to Diagnostics &rarr;</button>
  </div>
  `;

  const input = document.getElementById('symptom-input');
  const catSidebar = document.getElementById('cat-sidebar');
  const browseGrid = document.getElementById('browse-grid');
  const chips = document.getElementById('symptom-chips');
  const hint = document.getElementById('symptom-hint');

  function renderBrowseGrid(){
    let items;
    if(searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      items = SYMPTOM_LIST.filter(s=>s.toLowerCase().includes(q));
    } else if(activeCat==='All'){
      items = SYMPTOM_LIST;
    } else {
      items = CATEGORIES.find(c=>c.name===activeCat).items;
    }
    browseGrid.innerHTML = items.length ? items.map(s=>
      `<button type="button" class="browse-chip${selectedSymptoms.has(s)?' selected':''}" data-s="${esc(s)}">${esc(s)}</button>`
    ).join('') : `<span class="symptom-empty-hint">No matches found.</span>`;
  }

  function renderChips(){
    chips.innerHTML = [...selectedSymptoms].map(s=>`<span class="chip">${esc(s)}<button type="button" class="chip-x" data-s="${esc(s)}" aria-label="Remove">&times;</button></span>`).join('');
    hint.textContent = selectedSymptoms.size ? `${selectedSymptoms.size} symptom${selectedSymptoms.size>1?'s':''} selected.` : 'No symptoms selected yet \u2014 that\u2019s fine, we\u2019ll use your risk profile instead.';
  }

  // Handle Sidebar Category Clicks
  catSidebar.addEventListener('click', (e)=>{
    const btn = e.target.closest('.cat-side-btn');
    if(!btn) return;
    
    activeCat = btn.dataset.cat;
    
    // Clear search box when clicking a category
    input.value = '';
    searchQuery = '';
    
    catSidebar.querySelectorAll('.cat-side-btn').forEach(b=>b.classList.toggle('active', b===btn));
    renderBrowseGrid();
  });

  // Handle Search Input
  input.addEventListener('input', ()=>{
    searchQuery = input.value;
    
    // If user starts typing, automatically switch back to "All" visually
    if (searchQuery.trim().length > 0 && activeCat !== 'All') {
      activeCat = 'All';
      catSidebar.querySelectorAll('.cat-side-btn').forEach(b=>b.classList.toggle('active', b.dataset.cat === 'All'));
    }
    
    renderBrowseGrid();
  });

  // Handle Selecting a Symptom
  browseGrid.addEventListener('click', (e)=>{
    const btn = e.target.closest('.browse-chip');
    if(!btn) return;
    const s = btn.dataset.s;
    if(selectedSymptoms.has(s)){ selectedSymptoms.delete(s); btn.classList.remove('selected'); }
    else { selectedSymptoms.add(s); btn.classList.add('selected'); }
    renderChips();
  });

  // Handle Removing a Symptom
  chips.addEventListener('click', (e)=>{
    const btn = e.target.closest('.chip-x');
    if(!btn) return;
    selectedSymptoms.delete(btn.dataset.s);
    renderChips();
    renderBrowseGrid();
  });

  renderBrowseGrid();
  renderChips();

  const sugarInput = document.getElementById('f-fasting-sugar');
  const sugarUnknown = document.getElementById('f-fasting-sugar-unknown');
  const hrInput = document.getElementById('f-resting-hr');
  const hrUnknown = document.getElementById('f-resting-hr-unknown');
  
  sugarUnknown.addEventListener('change', ()=>{
    sugarInput.disabled = sugarUnknown.checked;
    if(sugarUnknown.checked) sugarInput.value = '';
  });
  hrUnknown.addEventListener('change', ()=>{
    hrInput.disabled = hrUnknown.checked;
    if(hrUnknown.checked) hrInput.value = '';
  });

  document.getElementById('continue-btn').addEventListener('click', ()=>{
    const nextProfile = Object.assign({}, profile, {symptoms: [...selectedSymptoms]});
    const fastingSugar = sugarUnknown.checked ? null : (parseFloat(sugarInput.value) || null);
    const restingHR = hrUnknown.checked ? null : (parseFloat(hrInput.value) || null);
    const nextVitals = {
      fastingSugar, fastingSugarUnknown: sugarUnknown.checked,
      restingHR, restingHRUnknown: hrUnknown.checked
    };
    const next = Object.assign({}, state, {profile: nextProfile, vitals: nextVitals});
    goTo('diagnostics.html', next);
  });
}


if(!profile){
  main.innerHTML = `<div class="empty-state">We need your profile first. <a href="profile.html">Go back and fill it in &rarr;</a></div>`;
} else {
  init();
}
</script>
</body>
</html>
