<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="View your complete health summary across diagnostics, daily routine, and nutrition, with key takeaways and actionable insights all in one place.">
          <title>Summary &mdash; KYH</title>
          <link rel="stylesheet" href="shared/styles.css">
            <style>
              .summary-hero { text-align: center; margin-bottom: 32px; padding-top: 8px; }
              .summary-hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; margin: 0 0 10px; letter-spacing: -0.02em; }
              .summary-hero h1 em { font-style: italic; color: var(--teal); }
              .summary-hero .sub { font-family: var(--serif); font-style: italic; font-size: clamp(16px, 2.4vw, 19px); color: var(--ink-soft); margin: 0 0 12px; }
              .summary-hero .lede { margin: 0 auto; max-width: 540px; text-align: center; }

              /* Outcome card — button reset + active */
              .action-grid .outcome-card {
              cursor: pointer; color: inherit; min-height: 160px;
              position: relative; padding-bottom: 36px;
              text-align: left; font-family: inherit;
              -webkit-appearance: none; appearance: none;
              }
              .action-grid .outcome-card.is-active { border-color: var(--teal); background: var(--teal-soft); transform: none; }
              .action-grid .outcome-card .icon-lg {
              width: 44px; height: 44px; border-radius: 50%;
              border: 1.5px solid var(--teal); background: var(--teal-soft); color: var(--teal);
              display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
              }
              .action-grid .outcome-card.is-active .icon-lg { background: var(--paper); }
              .action-grid .outcome-card .verb { margin-bottom: 6px; }
              .action-grid .outcome-card h3 { font-size: 17px; }
              .card-chevron {
              position: absolute; bottom: 12px; right: 14px;
              font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
              text-transform: uppercase; color: var(--muted);
              display: inline-block; transition: transform 0.22s ease, color 0.2s;
              }
              .outcome-card.is-active .card-chevron { transform: rotate(180deg); color: var(--teal); }

              /* Accordion panels */
              .outcome-panels { margin-top: -12px; margin-bottom: 28px; }
              .outcome-panel {
              display: grid; grid-template-rows: 0fr;
              transition: grid-template-rows 0.28s ease;
              overflow: hidden;
              background: var(--panel);
              border: 1px solid transparent;
              border-top: 2px solid transparent;
              }
              .outcome-panel.is-open { grid-template-rows: 1fr; border-color: var(--line); border-top-color: var(--teal); }
              .outcome-panel > .panel-inner { overflow: hidden; min-height: 0; padding: 0 24px; transition: padding 0.28s ease; }
              .outcome-panel.is-open > .panel-inner { padding: 24px 24px 20px; }

              /* Step cards */
              #insights { scroll-margin-top: 24px; }
              .step-card { border: 1px solid var(--line); border-left: 3px solid var(--teal); background: var(--panel); padding: 18px 18px 12px; margin-bottom: 18px; }
              .step-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
              .step-card-head .step-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); border: 1px solid color-mix(in srgb, var(--teal) 35%, transparent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
              .step-card-head .step-icon svg { width: 20px; height: 20px; }
              .step-card-head .step-title { font-family: var(--serif); font-size: 20px; font-weight: 400; line-height: 1.2; margin: 0; }
              .step-card-head .step-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; margin-top: 2px; }
              .tone-group { margin-bottom: 12px; }
              .tone-group:last-child { margin-bottom: 4px; }
              .tone-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
              .tone-label.act { color: var(--rose); }
              .tone-label.watch { color: var(--amber); }
              .tone-label.good { color: var(--teal); }
              .tone-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
              .insight-card { border: 1px solid var(--line); border-left: 3px solid var(--line); background: var(--paper); padding: 12px 14px; margin-bottom: 8px; }
              .insight-card.tone-good { border-left-color: var(--teal); }
              .insight-card.tone-watch { border-left-color: var(--amber); }
              .insight-card.tone-act { border-left-color: var(--rose); }
              .insight-card .insight-title { font-weight: 600; font-size: 14px; line-height: 1.35; margin-bottom: 4px; }
              .insight-card .insight-detail { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
              .insight-card .insight-next { margin-top: 6px; font-size: 12.5px; color: var(--ink); line-height: 1.45; }
              .insight-card .insight-next b { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; display: block; margin-bottom: 2px; }
              .step-empty { font-size: 13.5px; color: var(--muted); margin: 0 0 8px; }
              .step-summary { font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 2px; }
              .step-toggle { background: none; border: none; padding: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--teal); cursor: pointer; margin-top: 8px; display: inline-block; }
              .step-toggle:hover { text-decoration: underline; }
              .step-details[hidden] { display: none; }
              .step-details { margin-top: 14px; }
              .exec-summary { font-size: 15px; line-height: 1.7; max-width: 640px; margin: 0 auto; text-align: left; }

              /* AI prompt box */
              .prompt-box { background: var(--paper); border: 1px solid var(--line); padding: 16px 18px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; max-height: 280px; overflow-y: auto; margin-bottom: 12px; }

              /* Video grid */
              .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
              .video-card { display: block; text-decoration: none; color: inherit; border: 1px solid var(--line); background: var(--panel); transition: border-color .15s; }
              .video-card:hover { border-color: var(--teal); }
              .video-thumb-wrap { position: relative; aspect-ratio: 16/9; background: var(--line); overflow: hidden; }
              .video-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
              .video-duration { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.75); color: #fff; font-family: var(--mono); font-size: 10px; padding: 2px 5px; }
              .video-title { font-size: 13px; font-weight: 600; padding: 10px 12px 4px; line-height: 1.35; }
              .video-tags { padding: 0 12px 12px; display: flex; flex-wrap: wrap; gap: 4px; }
              .video-source-title { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 10px; }

              /* Running summary (Your insights) */
              .rs-intro { font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 16px; }
              .rs-section { border: 1px solid var(--line); border-left: 3px solid var(--teal); background: var(--panel); padding: 16px 18px 8px; margin-bottom: 16px; }
              .rs-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
              .rs-head .rs-ic { width: 36px; height: 36px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); border: 1px solid color-mix(in srgb, var(--teal) 35%, transparent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
              .rs-head .rs-ic svg { width: 19px; height: 19px; }
              .rs-head h3 { font-family: var(--serif); font-weight: 400; font-size: 19px; margin: 0; line-height: 1.2; }
              .rs-head .rs-sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--muted); margin-top: 2px; }
              .rs-list { list-style: none; margin: 0; padding: 0; }
              .rs-item { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
              .rs-item:first-child { border-top: none; padding-top: 2px; }
              .rs-num { flex: 0 0 24px; height: 24px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); font-family: var(--mono); font-size: 11px; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); margin-top: 1px; }
              .rs-title { font-weight: 600; font-size: 14px; line-height: 1.35; }
              .rs-pri { display: inline-block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; border: 1px solid currentColor; }
              .rs-pri.high { color: var(--rose); } .rs-pri.mid { color: var(--amber); }
              .rs-detail { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-top: 3px; }
              .rs-idea { font-size: 12.5px; line-height: 1.45; margin-top: 4px; }
              .rs-idea b { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; margin-right: 6px; }
              .rs-more, .rs-empty { font-size: 12.5px; color: var(--muted); margin: 2px 0 10px; }
              .ai-guide { border: 1px solid var(--line); border-left: 3px solid var(--amber); background: var(--panel); padding: 16px 18px; margin: 4px 0 22px; }
              .ai-guide h3 { font-family: var(--serif); font-weight: 400; font-size: 19px; margin: 0 0 4px; }
              .ai-guide .lede2 { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 12px; line-height: 1.55; }
              .ai-guide ol { margin: 0; padding-left: 20px; font-size: 13.5px; line-height: 1.6; }
              .ai-guide li { margin-bottom: 8px; }
              .ai-guide li b { font-weight: 600; }
              .detail-divider { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 24px 0 12px; display: flex; align-items: center; gap: 10px; }
              .detail-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

              /* Doctor brief -- one A4 page (screen preview + print) */
              .db-preview-wrap { width: 100%; overflow: hidden; background: var(--paper); border: 1px solid var(--line); padding: 12px; margin-bottom: 14px; }
              .db-preview-scaler { transform-origin: top left; }
              .db-sheet, .db-sheet * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
              .db-sheet { width: 194mm; height: 281mm; overflow: hidden; background: #fff; color: #182620; font-family: var(--sans); font-size: 8.4pt; line-height: 1.32; padding: 5mm 6mm 4mm; display: flex; flex-direction: column; gap: 3.2mm; border: 1px solid #d7ddd2; }
              #db-print-root .db-sheet { width: 100%; border: none; }
              .db-head { display: flex; align-items: center; gap: 4mm; padding-bottom: 2.6mm; border-bottom: 0.6mm solid #1f7a6c; }
              .db-logo { height: 13mm; width: auto; display: block; }
              .db-head-mid { flex: 1; min-width: 0; }
              .db-title { font-family: var(--serif); font-size: 19pt; line-height: 1.05; color: #1f7a6c; }
              .db-tag { font-size: 7.6pt; color: #3d4a44; margin-top: 0.8mm; }
              .db-date { text-align: right; font-weight: 600; font-size: 9.5pt; white-space: nowrap; }
              .db-date span { display: block; font-family: var(--mono); font-size: 6.5pt; letter-spacing: .12em; text-transform: uppercase; color: #6d786f; font-weight: 400; }
              .db-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3.2mm; align-items: start; }
              .db-grid-2:first-of-type { grid-template-columns: 1.25fr 1fr; }
              .db-sec { border: 0.3mm solid #d7ddd2; border-radius: 1.6mm; padding: 2.4mm 3mm 2.6mm; min-width: 0; }
              .db-sec-head { display: flex; align-items: center; gap: 2.6mm; margin-bottom: 1.8mm; }
              .db-icon { width: 10.5mm; height: 10.5mm; flex: 0 0 10.5mm; border-radius: 50%; background: #e3f0ec; color: #1f7a6c; display: flex; align-items: center; justify-content: center; }
              .db-icon svg { width: 6.4mm; height: 6.4mm; }
              .db-sec-title { font-family: var(--serif); font-size: 11.5pt; line-height: 1.1; }
              .db-sec-sub { font-family: var(--mono); font-size: 6.4pt; letter-spacing: .05em; text-transform: uppercase; color: #6d786f; margin-top: 0.5mm; }
              .db-facts { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1.2mm 3mm; }
              .db-facts dt { font-family: var(--mono); font-size: 6.2pt; letter-spacing: .08em; text-transform: uppercase; color: #6d786f; }
              .db-facts dd { margin: 0; font-weight: 600; font-size: 8.4pt; }
              .db-chips { display: flex; flex-wrap: wrap; gap: 1.2mm; }
              .db-chip { background: #e3f0ec; color: #14584d; border-radius: 10mm; padding: 0.5mm 2.4mm; font-size: 7.6pt; }
              .db-muted { color: #6d786f; margin: 0; font-size: 8pt; }
              .db-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.8mm; }
              .db-item { display: flex; gap: 2.2mm; }
              .db-num { flex: 0 0 5mm; height: 5mm; border-radius: 50%; background: #1f7a6c; color: #fff; font-weight: 700; font-size: 7.4pt; display: flex; align-items: center; justify-content: center; margin-top: 0.3mm; }
              .db-item-body { min-width: 0; }
              .db-item-title { font-weight: 700; font-size: 8.8pt; }
              .db-item-q { font-style: italic; color: #14584d; margin-top: 0.4mm; }
              .db-item-meta { color: #3d4a44; font-size: 7.6pt; margin-top: 0.4mm; }
              .db-prep { color: #6d786f; }
              .db-badge { display: inline-block; font-family: var(--mono); font-size: 6pt; letter-spacing: .06em; text-transform: uppercase; border-radius: 1mm; padding: 0.2mm 1.4mm; margin-left: 1mm; vertical-align: 0.4mm; font-weight: 400; }
              .db-badge.db-within { background: #e3f0ec; color: #14584d; }
              .db-badge.db-flagged { background: #f3e2dd; color: #a8503f; }
              .db-badge.db-suggested { background: #f7e9d8; color: #8a5219; }
              .db-rolls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2mm; margin-top: 2.2mm; padding-top: 2mm; border-top: 0.3mm dashed #d7ddd2; }
              .db-roll { border-radius: 1.2mm; padding: 1.4mm 2mm; font-size: 7.2pt; }
              .db-roll-within { background: #e3f0ec; } .db-roll-flagged { background: #f3e2dd; } .db-roll-suggested { background: #f7e9d8; }
              .db-roll-h { font-weight: 700; font-size: 7.6pt; }
              .db-roll-n { font-family: var(--serif); font-size: 11pt; }
              .db-roll-list { color: #3d4a44; margin-top: 0.4mm; }
              .db-stat { display: flex; align-items: center; gap: 2.4mm; background: #e3f0ec; border-radius: 1.4mm; padding: 1.6mm 2.4mm; margin-bottom: 2mm; }
              .db-stat-ic { width: 6mm; height: 6mm; color: #1f7a6c; flex: 0 0 6mm; } .db-stat-ic svg { width: 100%; height: 100%; }
              .db-stat-val { font-family: var(--serif); font-size: 12.5pt; line-height: 1.1; color: #14584d; }
              .db-stat-lbl { font-size: 7pt; color: #3d4a44; }
              .db-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 4mm; border-top: 0.3mm solid #d7ddd2; padding-top: 1.8mm; font-size: 6.8pt; color: #6d786f; }
              .db-url { font-family: var(--mono); font-weight: 700; color: #1f7a6c; font-size: 7.6pt; white-space: nowrap; }
              .db-compact .db-wf { display: none; }
              .db-flagbox { margin-top: 2mm; padding: 1.6mm 2.4mm; background: #f3e2dd; border-left: 0.8mm solid #a8503f; border-radius: 1mm; }
              .db-flagbox-h { font-family: var(--mono); font-size: 6.4pt; letter-spacing: .08em; text-transform: uppercase; color: #a8503f; margin-bottom: 0.8mm; }
              .db-flag-row { font-size: 7.8pt; margin-top: 0.6mm; overflow-wrap: anywhere; }
              .db-note { color: #182620; }
              .db-tight { font-size: 7.4pt; }
              .db-tight .db-item-title, .db-tight .db-facts dd { font-size: 7.8pt; }
              #db-print-root { display: none; }

              /* Print */
              @page { size: A4; margin: 8mm; }
              @media print {
              body > * { display: revert !important; }
              .print-only { display: block !important; }
              .no-print, .masthead, footer, .page-footer-nav, .action-grid, .outcome-panels, .summary-hero, .note-block { display: none !important; }
              #insights { display: block !important; }
              .step-details { display: block !important; }
              .step-toggle { display: none !important; }
              .step-card, .insight-card { break-inside: avoid; background: #fff; }
              body { background: #fff; }
              /* Doctor brief mode: only the one-page sheet prints */
              #db-print-root { display: none !important; }
              body[data-print="brief"] > *:not(#db-print-root) { display: none !important; }
              body[data-print="brief"] > #db-print-root { display: block !important; }
              body[data-print="brief"] .db-sheet { break-inside: avoid; page-break-after: avoid; }
              }
            </style>
          </head>
  <body>

    <header class="masthead no-print" id="app-header"></header>
    <main id="main-content">
      <div class="empty-state">Loading your summary&#8230;</div>
    </main>
    <div class="print-only" id="print-document" aria-hidden="true"></div>
    <div id="insights" style="display:none;" aria-hidden="true"></div>
    <div id="db-print-root" aria-hidden="true"></div>
    <footer id="app-footer"></footer>

    <script src="shared/data.diagnostics.js"></script>
    <script src="shared/data.videos.sb.js"></script>
    <script src="shared/data.videos.nbs.js"></script>
    <script src="shared/drsk_video_data.js"></script>
    <script src="shared/ayushyp_video_data.js"></script>
    <script src="shared/curated_routine_video_data.js"></script>
    <script src="shared/data.activities.js"></script>
    <script src="shared/data.exercises.js"></script>
    <script src="shared/utils.js"></script>
    <script src="shared/insights.js"></script>
    <script src="shared/doctorbrief.js"></script>
    <script src="shared/icons.js"></script>
    <script src="shared/summary-page.js"></script>
  </body>
</html>
