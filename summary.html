<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summary &mdash; KYH</title>
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner" style="display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;">
    <div class="brand-lockup" style="margin-bottom:0;">
      <a href="index.html" style="text-decoration:none;">
        <img src="shared/assets/kyh_logo.jpg" alt="KYH – Know Your Health" style="height:38px; width:auto; display:block;">
      </a>
    </div>
    <div class="map-route" aria-label="Your progress from Fine to Great">
      <div class="map-stop"><div class="map-pin" style="border-color:var(--teal); color:var(--teal);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-6-5.4-6-10a6 6 0 1 1 12 0c0 4.6-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg></div><div class="label">Fine</div></div>
      <div class="map-line"></div>
      <div class="map-stop"><div class="map-pin" style="border-color:var(--teal); color:var(--teal);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></div><div class="label">Diagnostics</div></div>
      <div class="map-line"></div>
      <div class="map-stop"><div class="map-pin" style="border-color:var(--teal); color:var(--teal);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div><div class="label">Routine</div></div>
      <div class="map-line"></div>
      <div class="map-stop"><div class="map-pin" style="border-color:var(--teal); color:var(--teal);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></div><div class="label">Diet</div></div>
      <div class="map-line"></div>
      <div class="map-stop active"><div class="map-pin" style="border-color:var(--ink); color:var(--paper); background:var(--ink);"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17.3 5.7 21.4 8 14 2 9.4h7.6z"/></svg></div><div class="label" style="color:var(--ink); font-weight:600;">Great</div></div>
    </div>
  </div>
</header>

<main id="main-content">
  <div class="empty-state">Loading your summary…</div>
</main>

<footer>
  <span>KYH — Know Your Health. Own Your Path. Runs entirely in your browser.</span>
  <span>Not a substitute for professional medical advice.</span>
</footer>

<script src="shared/utils.js"></script>
<script>
const state = loadState() || {};
const profile = state.profile || {};
const routine = state.routine || {};
const diet = state.diet || {};
const diagnostics = state.diagnostics || {};
const main = document.getElementById("main-content");

function fmt(val, fallback = "—") {
  return (val === undefined || val === null || val === "") ? fallback : val;
}

function render() {
  if (!profile.sex) {
    main.innerHTML = `<div class="empty-state">No profile found. <a href="profile.html">Start here →</a></div>`;
    return;
  }

  // ----- Profile -----
  const bmiText = profile.bmi ? `${profile.bmi.toFixed(1)}` : "—";
  const whtrText = profile.whtr ? profile.whtr.toFixed(2) : (profile.waistCm && profile.heightCm ? (profile.waistCm / profile.heightCm).toFixed(2) : "—");
  const symptoms = (profile.symptoms || []).slice(0, 8).join(", ") || "None recorded";
  const vitals = state.vitals || {};
  const sugarText = (vitals.fastingSugar != null && vitals.fastingSugar !== "")
  ? `${vitals.fastingSugar} mg/dL` : "—";
  const hrText = (vitals.restingHR != null && vitals.restingHR !== "")
  ? `${vitals.restingHR} bpm` : "—";
  const whtrVal = profile.whtr != null
  ? profile.whtr
  : (profile.waistCm && profile.heightCm ? profile.waistCm / profile.heightCm : null);
  const symptomsText = (profile.symptoms || []).slice(0, 10).join(", ") || "None recorded";

  // ----- Diagnostics -----
  const topTests = diagnostics.topTests || diagnostics.tests || [];
  const dueTests = (diagnostics.due || []).join(", ") || "None marked due";
  const testSummary = topTests.length
    ? topTests.slice(0, 6).map(t => t.test || t.name || t).join(", ")
    : "No tests prioritised yet";

  // ----- Routine -----
  const estBurn = routine.estimatedCalories ? `~${routine.estimatedCalories.toLocaleString()} kcal` : "—";
  const sleep = routine.actual?.sleep != null ? `${routine.actual.sleep}h` : "—";
  const exercise = routine.actual?.exercise != null ? `${routine.actual.exercise}h` : "—";
  const steps = routine.habits?.steps != null ? routine.habits.steps.toLocaleString() : "—";

  // ----- Diet -----
  const dietType = diet.type || "—";
  const cuisine = diet.cuisine || "";
  const targetCal = diet.target?.cal ? `~${parseInt(diet.target.cal).toLocaleString()} kcal` : "—";
  const topNutrients = (diet.priorities || []).slice(0, 5).map(n => n.nutrient).join(", ") || "Not yet prioritised";
  const freq = diet.frequency || {};
  const foodFlags = [];
  if (freq.sugary_drinks === "Daily" || freq.sugary_drinks === "3-5x/Wk") foodFlags.push("Sugary drinks high");
  if (freq.fried_ultraprocessed === "Daily" || freq.fried_ultraprocessed === "3-5x/Wk") foodFlags.push("Fried / ultra-processed high");
  if (freq.leafy_greens === "Rarely" || freq.leafy_greens === "1-2x/Wk") foodFlags.push("Leafy greens low");
  if (freq.fruits === "Rarely") foodFlags.push("Fruits low");
  const foodFlagText = foodFlags.length ? foodFlags.join(" · ") : "No major red flags";

  main.innerHTML = `
    <div class="section-head">
      <h2>Your Health Summary</h2>
      <span class="section-sub">Great</span>
    </div>
    <p class="lede" style="margin-bottom:28px;">
      A compact snapshot of everything you’ve told us so far.
    </p>

    <!-- PROFILE -->
    <div class="cat-title">Profile</div>
    <div class="test-card">
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px 18px; font-size:13.5px;">
        <div><span class="eyebrow-label">Sex / Age</span><div>${fmt(profile.sex)} · ${fmt(profile.age)}</div></div>
        <div><span class="eyebrow-label">BMI</span><div>${bmiText}</div></div>
        <div><span class="eyebrow-label">Waist-to-Height</span><div>${whtrText}</div></div>
        <div><span class="eyebrow-label">Fasting Sugar</span><div>${sugarText}</div></div>
        <div><span class="eyebrow-label">Resting HR</span><div>${hrText}</div></div>

        <div><span class="eyebrow-label">Smoking</span><div>${fmt(profile.smoking)}</div></div>
        <div><span class="eyebrow-label">Alcohol</span><div>${fmt(profile.alcohol)}</div></div>
      </div>
      <div style="margin-top:14px; font-size:13px; color:var(--ink-soft);">
        <b>Symptoms:</b> ${symptoms}
      </div>
    </div>

    <!-- DIAGNOSTICS -->
    <div class="cat-title">Diagnostics</div>
    <div class="test-card">
      <div style="font-size:13.5px; margin-bottom:8px;">
        <b>Top recommended tests:</b> ${testSummary}
      </div>
 
    </div>

    <!-- ROUTINE -->
    <div class="cat-title">Daily Routine</div>
    <div class="test-card">
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:12px 18px; font-size:13.5px;">
        <div><span class="eyebrow-label">Est. Daily Burn</span><div>${estBurn}</div></div>
        <div><span class="eyebrow-label">Sleep</span><div>${sleep}</div></div>
        <div><span class="eyebrow-label">Exercise</span><div>${exercise}</div></div>
        <div><span class="eyebrow-label">Steps</span><div>${steps}</div></div>
      </div>
    </div>

    <!-- DIET -->
    <div class="cat-title">Diet</div>
    <div class="test-card">
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px 18px; font-size:13.5px; margin-bottom:12px;">
        <div><span class="eyebrow-label">Preference</span><div>${dietType}${cuisine ? " · " + cuisine : ""}</div></div>
        <div><span class="eyebrow-label">Calorie Target</span><div>${targetCal}</div></div>
      </div>
      <div style="font-size:13.5px; margin-bottom:8px;">
        <b>Priority nutrients:</b> ${topNutrients}
      </div>
      <div style="font-size:13px; color:var(--ink-soft);">
        <b>Food quality signals:</b> ${foodFlagText}
      </div>
    </div>

    <div class="page-footer-nav">
      <a href="diet-synthesis.html" class="btn secondary">← Back</a>
      <a href="nextsteps.html" class="btn">Next Steps →</a>
    </div>
  `;
}

render();
</script>
</body>
</html>
