<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About You — KYH</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>

<header class="masthead" id="app-header"></header>

<main>
  <form id="profile-form">

    <div class="note-block teal" style="margin-bottom:22px;">
      <span class="k">Session memory</span>
      <div class="check-field" style="margin-top:8px;">
        <input type="checkbox" id="f-remember">
        <label for="f-remember">
          Remember my progress on this device until I clear it
          <span style="display:block;font-size:12px;color:var(--ink-soft);font-weight:400;margin-top:2px;">
            Helps if the tab closes (for example after print). Data stays only in this browser — still not sent to any server.
            Uncheck anytime to clear the saved copy.
          </span>
        </label>
      </div>
    </div>

    <div class="field-row" style="margin-bottom:22px;">
      <div class="field">
        <label class="intake-label" for="f-sex">Sex</label>
        <select id="f-sex"><option value="" selected disabled>&mdash; Select &mdash;</option><option value="Female">Female</option><option value="Male">Male</option></select>
      </div>
      <div class="field">
        <label class="intake-label" for="f-age">Age</label>
        <input type="number" id="f-age" min="16" max="100" placeholder="years">
      </div>
    </div>

    <div class="field-row" style="margin-bottom:8px;">
      <div class="field">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
          <label class="intake-label" style="margin-bottom:0;">Height</label>
          <div class="unit-toggle small" id="height-unit-toggle">
            <button type="button" data-unit="cm">cm</button>
            <button type="button" data-unit="ftin" class="active">ft/in</button>
          </div>
        </div>
        <div id="height-cm-wrap" style="display:none;"><input type="number" id="f-height-cm" min="120" max="230" placeholder="cm" step="any"></div>
        <div id="height-ftin-wrap" class="unit-pair">
          <input type="number" id="f-height-ft" min="3" max="7" placeholder="ft" step="any">
          <input type="number" id="f-height-in" min="0" max="11.9" step="0.1" placeholder="in">
        </div>
      </div>
      <div class="field">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
          <label class="intake-label" style="margin-bottom:0;">Weight</label>
          <div class="unit-toggle small" id="weight-unit-toggle">
            <button type="button" data-unit="kg" class="active">kg</button>
            <button type="button" data-unit="lb">lb</button>
          </div>
        </div>
        <div id="weight-kg-wrap"><input type="number" id="f-weight-kg" min="30" max="250" placeholder="kg" step="any"></div>
        <div id="weight-lb-wrap" style="display:none;"><input type="number" id="f-weight-lb" min="66" max="550" placeholder="lb" step="any"></div>
      </div>
      <div class="field">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
          <label class="intake-label" style="margin-bottom:0;">Waist</label>
          <div class="unit-toggle small" id="waist-unit-toggle">
            <button type="button" data-unit="cm">cm</button>
            <button type="button" data-unit="in" class="active">in</button>
          </div>
        </div>
        <div id="waist-cm-wrap" style="display:none;"><input type="number" id="f-waist-cm" min="50" max="200" placeholder="cm" step="any"></div>
        <div id="waist-in-wrap"><input type="number" id="f-waist-in" min="20" max="80" placeholder="in" step="any"></div>
      </div>
    </div>

    <div class="badge-row">
      <div class="badge">
        <div class="badge-ring" id="bmi-ring">&mdash;</div>
        <div class="badge-text"><b>Body Mass Index</b><span id="bmi-tag-text"></span></div>
      </div>
      <div class="badge">
        <div class="badge-ring amber" id="whtr-ring">&mdash;</div>
        <div class="badge-text"><b>Waist-to-Height Ratio</b><span id="whtr-tag-text"></span></div>
      </div>
    </div>

    <div class="cat-title">Lifestyle</div>
    <div class="field-row" style="margin-bottom:22px;">
      <div class="field">
        <label class="intake-label" for="f-smoking">Smoking</label>
        <select id="f-smoking">
          <option value="" selected disabled>&mdash; Select &mdash;</option>
          <option value="Never">Never</option>
          <option value="Former smoker">Former smoker</option>
          <option value="Occasionally">Occasionally</option>
          <option value="Daily">Daily</option>
        </select>
      </div>
      <div class="field">
        <label class="intake-label" for="f-alcohol">Alcohol</label>
        <select id="f-alcohol">
          <option value="" selected disabled>&mdash; Select &mdash;</option>
          <option value="Never">Never</option>
          <option value="Occasional">Occasional / social</option>
          <option value="1-2x/week">1&ndash;2x / week</option>
          <option value="3-5x/week">3&ndash;5x / week</option>
          <option value="Daily">Daily</option>
        </select>
      </div>
    </div>

    <div class="cat-title" id="repro-title" style="display:none;">Reproductive health</div>
    <div class="field-row" id="repro-field-row" style="display:none; margin-bottom:22px;">
      <div class="field" style="max-width:280px;">
        <label class="intake-label" for="f-repro-status">Menstrual &amp; menopause status</label>
        <select id="f-repro-status">
          <option value="" selected disabled>&mdash; Select &mdash;</option>
          <option value="Regular cycle">Regular cycle</option>
          <option value="Irregular cycle">Irregular cycle</option>
          <option value="Currently pregnant">Currently pregnant</option>
          <option value="Postpartum">Postpartum (within 1 year)</option>
          <option value="Perimenopausal">Perimenopausal</option>
          <option value="Post-menopausal">Post-menopausal</option>
          <option value="Not applicable">Not applicable</option>
          <option value="Not sure">Not sure</option>
        </select>
      </div>
      <div class="check-field" style="align-self:end; padding-bottom:9px;">
        <input type="checkbox" id="f-pcos">
        <label for="f-pcos">Diagnosed with PCOS</label>
      </div>
    </div>

    <div class="cat-title">Family history</div>
    <div class="field-row" style="grid-template-columns:1fr 1fr; margin-bottom:22px;">
      <div class="check-field">
        <input type="checkbox" id="f-fam-metabolic">
        <label for="f-fam-metabolic">Diabetes / metabolic conditions in immediate family</label>
      </div>
      <div class="check-field">
        <input type="checkbox" id="f-fam-cardio">
        <label for="f-fam-cardio">Heart disease / hypertension in immediate family</label>
      </div>
    </div>

    <div class="page-footer-nav">
      <span class="validation-msg" id="validation-msg"></span>
      <button type="submit" class="btn">Continue to Symptoms &rarr;</button>
    </div>
  </form>
</main>

<footer>
  <span>KYH — Know Your Health. Own Your Path. Runs entirely in your browser. Nothing is sent to a server.</span>
  <span>Not a substitute for professional medical advice.</span>
</footer>

<script src="shared/utils.js"></script>
<script>
renderHeader('fine', 'KYH - Profile');

const state = loadState();
const p = state.profile || {};

/* ---- remember preference ---- */
const rememberEl = document.getElementById('f-remember');
if (rememberEl) {
  rememberEl.checked = isRememberEnabled();
  rememberEl.addEventListener('change', () => {
    setRememberEnabled(rememberEl.checked);
    if (rememberEl.checked) {
      persistState(loadState());
    }
  });
}

/* ---- restore prior values if present ---- */
if (p.sex) document.getElementById('f-sex').value = p.sex;
if (p.age) document.getElementById('f-age').value = p.age;
if (p.heightCm) {
  document.getElementById('f-height-cm').value = Math.round(p.heightCm * 10) / 10;
  const { ft, inch } = cmToFtIn(p.heightCm);
  document.getElementById('f-height-ft').value = ft;
  document.getElementById('f-height-in').value = inch;
}
if (p.weightKg) document.getElementById('f-weight-kg').value = Math.round(p.weightKg * 10) / 10;
if (p.waistCm) {
  document.getElementById('f-waist-cm').value = Math.round(p.waistCm * 10) / 10;
  document.getElementById('f-waist-in').value = Math.round(cmToInFlat(p.waistCm) * 10) / 10;
}
if (p.famMetabolic) document.getElementById('f-fam-metabolic').checked = true;
if (p.famCardio) document.getElementById('f-fam-cardio').checked = true;
if (p.smoking) document.getElementById('f-smoking').value = p.smoking;
if (p.alcohol) document.getElementById('f-alcohol').value = p.alcohol;
if (p.reproStatus) document.getElementById('f-repro-status').value = p.reproStatus;
if (p.pcos) document.getElementById('f-pcos').checked = true;
if (p.medicalStatus) document.getElementById('f-medical-status').value = p.medicalStatus;

/* ---- reproductive health section only applies to females ---- */
function updateReproVisibility() {
  const show = document.getElementById('f-sex').value === 'Female';
  document.getElementById('repro-title').style.display = show ? 'flex' : 'none';
  document.getElementById('repro-field-row').style.display = show ? 'grid' : 'none';
}
document.getElementById('f-sex').addEventListener('change', updateReproVisibility);
updateReproVisibility();

/* ---- per-field unit toggles ---- */
let heightUnit = 'ftin', weightUnit = 'kg', waistUnit = 'in';

function wireUnitToggle(toggleId, onChange) {
  document.getElementById(toggleId).addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll(`#${toggleId} button`).forEach(b => b.classList.toggle('active', b === btn));
    onChange(btn.dataset.unit);
  });
}

function getHeightCm() {
  if (heightUnit === 'cm') return parseFloat(document.getElementById('f-height-cm').value);
  const ft = parseFloat(document.getElementById('f-height-ft').value) || 0;
  const inch = parseFloat(document.getElementById('f-height-in').value) || 0;
  return (ft || inch) ? ftInToCm(ft, inch) : NaN;
}
function getWeightKg() {
  if (weightUnit === 'kg') return parseFloat(document.getElementById('f-weight-kg').value);
  const lb = parseFloat(document.getElementById('f-weight-lb').value);
  return isNaN(lb) ? NaN : lbToKg(lb);
}
function getWaistCm() {
  if (waistUnit === 'cm') return parseFloat(document.getElementById('f-waist-cm').value);
  const inW = parseFloat(document.getElementById('f-waist-in').value);
  return isNaN(inW) ? NaN : inFlatToCm(inW);
}

wireUnitToggle('height-unit-toggle', (target) => {
  if (target === heightUnit) return;
  const cm = getHeightCm();
  heightUnit = target;
  if (target === 'ftin') {
    const { ft, inch } = cmToFtIn(cm || 0);
    document.getElementById('f-height-ft').value = cm ? ft : '';
    document.getElementById('f-height-in').value = cm ? inch : '';
    document.getElementById('height-cm-wrap').style.display = 'none';
    document.getElementById('height-ftin-wrap').style.display = 'grid';
  } else {
    document.getElementById('f-height-cm').value = cm ? Math.round(cm * 10) / 10 : '';
    document.getElementById('height-cm-wrap').style.display = 'block';
    document.getElementById('height-ftin-wrap').style.display = 'none';
  }
  refreshMetrics();
});
wireUnitToggle('weight-unit-toggle', (target) => {
  if (target === weightUnit) return;
  const kg = getWeightKg();
  weightUnit = target;
  if (target === 'lb') {
    document.getElementById('f-weight-lb').value = kg ? Math.round(kgToLb(kg) * 10) / 10 : '';
    document.getElementById('weight-kg-wrap').style.display = 'none';
    document.getElementById('weight-lb-wrap').style.display = 'block';
  } else {
    document.getElementById('f-weight-kg').value = kg ? Math.round(kg * 10) / 10 : '';
    document.getElementById('weight-kg-wrap').style.display = 'block';
    document.getElementById('weight-lb-wrap').style.display = 'none';
  }
  refreshMetrics();
});
wireUnitToggle('waist-unit-toggle', (target) => {
  if (target === waistUnit) return;
  const cm = getWaistCm();
  waistUnit = target;
  if (target === 'in') {
    document.getElementById('f-waist-in').value = cm ? Math.round(cmToInFlat(cm) * 10) / 10 : '';
    document.getElementById('waist-cm-wrap').style.display = 'none';
    document.getElementById('waist-in-wrap').style.display = 'block';
  } else {
    document.getElementById('f-waist-cm').value = cm ? Math.round(cm * 10) / 10 : '';
    document.getElementById('waist-cm-wrap').style.display = 'block';
    document.getElementById('waist-in-wrap').style.display = 'none';
  }
  refreshMetrics();
});

function refreshMetrics() {
  const heightCm = getHeightCm(), weightKg = getWeightKg(), waistCm = getWaistCm();
  const bmiEl = document.getElementById('bmi-ring');
  const bmiTagEl = document.getElementById('bmi-tag-text');
  const whtrEl = document.getElementById('whtr-ring');
  const whtrTagEl = document.getElementById('whtr-tag-text');

  if (heightCm > 0 && weightKg > 0) {
    const bmi = computeBMI(weightKg, heightCm);
    const [label] = bmiTag(bmi);
    bmiEl.textContent = bmi.toFixed(1);
    bmiTagEl.textContent = label;
  } else {
    bmiEl.textContent = '\u2014'; bmiTagEl.textContent = '';
  }
  if (heightCm > 0 && waistCm > 0) {
    const whtr = computeWHtR(waistCm, heightCm);
    const [label] = whtrTag(whtr);
    whtrEl.textContent = whtr.toFixed(2).replace(/^0/, '');
    whtrTagEl.textContent = label;
  } else {
    whtrEl.textContent = '\u2014'; whtrTagEl.textContent = '';
  }
}

['f-height-cm', 'f-height-ft', 'f-height-in', 'f-weight-kg', 'f-weight-lb', 'f-waist-cm', 'f-waist-in'].forEach(id => {
  document.getElementById(id).addEventListener('input', refreshMetrics);
});
refreshMetrics();

/* ---- IMMEDIATE BAILOUT CHECK FOR MEDICAL STATUS ---- */
function checkImmediateBailout() {
  const medicalStatus = document.getElementById('f-medical-status').value;
  
  const bailoutMap = {
    'surgery': 'surgery',
    'hospitalization': 'hospitalization',
    'treatment': 'treatment',
    'medication': 'medication'
  };
  
  const bailoutReason = bailoutMap[medicalStatus];
  
  if (bailoutReason) {
    const sex = document.getElementById('f-sex').value;
    const age = parseFloat(document.getElementById('f-age').value);
    const heightCm = getHeightCm();
    const weightKg = getWeightKg();
    const waistCm = getWaistCm();
    
    persistState({
      profile: {
        sex, age, heightCm, weightKg, waistCm, 
        bmi: (heightCm > 0 && weightKg > 0) ? computeBMI(weightKg, heightCm) : null,
        whtr: (heightCm > 0 && waistCm > 0) ? computeWHtR(waistCm, heightCm) : null,
        reproStatus: sex === 'Female' ? document.getElementById('f-repro-status').value : null,
        smoking: document.getElementById('f-smoking').value,
        alcohol: document.getElementById('f-alcohol').value,
        famMetabolic: document.getElementById('f-fam-metabolic').checked,
        famCardio: document.getElementById('f-fam-cardio').checked,
        pcos: sex === 'Female' ? document.getElementById('f-pcos').checked : false,
        medicalStatus
      }
    });
    
    window.location.href = `not-ready.html?reason=${bailoutReason}`;
  }
}

document.getElementById('f-medical-status').addEventListener('change', checkImmediateBailout);

/* ---- submit ---- */
document.getElementById('profile-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const sex = document.getElementById('f-sex').value;
  const age = parseFloat(document.getElementById('f-age').value);
  const heightCm = getHeightCm(), weightKg = getWeightKg(), waistCm = getWaistCm();
  const smoking = document.getElementById('f-smoking').value;
  const alcohol = document.getElementById('f-alcohol').value;
  const reproStatus = document.getElementById('f-repro-status').value;
  const medicalStatus = document.getElementById('f-medical-status').value;
  
  const msg = document.getElementById('validation-msg');

  if (!sex || isNaN(age) || age <= 0 || isNaN(heightCm) || heightCm <= 0 || isNaN(weightKg) || weightKg <= 0 || isNaN(waistCm) || waistCm <= 0 || !smoking || !alcohol) {
    msg.textContent = 'Please fill in every field above before continuing.';
    return;
  }
  if (sex === 'Female' && !reproStatus) {
    msg.textContent = 'Please select your menstrual & menopause status before continuing.';
    return;
  }
  if (!medicalStatus) {
    msg.textContent = 'Please select your current medical situation before continuing.';
    return;
  }

  // ---- BAILOUT CONDITIONS CHECK ON SUBMIT ----
  let bailoutReason = null;
  
  if (reproStatus === 'Currently pregnant') {
    bailoutReason = 'pregnancy';
  } else if (medicalStatus !== 'stable') {
    bailoutReason = medicalStatus;
  }

  if (bailoutReason) {
    persistState({
      profile: {
        sex, age, heightCm, weightKg, waistCm,
        bmi: computeBMI(weightKg, heightCm),
        whtr: computeWHtR(waistCm, heightCm),
        reproStatus: sex === 'Female' ? reproStatus : null,
        smoking, alcohol,
        famMetabolic: document.getElementById('f-fam-metabolic').checked,
        famCardio: document.getElementById('f-fam-cardio').checked,
        pcos: sex === 'Female' ? document.getElementById('f-pcos').checked : false,
        medicalStatus
      }
    });
    window.location.href = `not-ready.html?reason=${bailoutReason}`;
    return;
  }

  msg.textContent = '';

  // Apply remember preference before saving this step
  setRememberEnabled(document.getElementById('f-remember').checked);

  const bmi = computeBMI(weightKg, heightCm);
  const whtr = computeWHtR(waistCm, heightCm);
  const profile = {
    sex, age, heightCm, weightKg, waistCm, bmi, whtr,
    famMetabolic: document.getElementById('f-fam-metabolic').checked,
    famCardio: document.getElementById('f-fam-cardio').checked,
    smoking, alcohol,
    reproStatus: sex === 'Female' ? reproStatus : null,
    pcos: sex === 'Female' ? document.getElementById('f-pcos').checked : false,
    medicalStatus,
    symptoms: p.symptoms || []
  };
  const next = Object.assign({}, state, {profile});
  goTo('symptoms.html', next);
});
</script>

</body>
</html>
